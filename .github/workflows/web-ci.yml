name: Web CI

on:
  # ไม่กรอง paths ที่ pull_request — ต้องให้ check "Web / lint-and-test" รายงานผลทุก PR
  # เพราะถูกตั้งเป็น required status check บน main (ไม่งั้น PR ที่ไม่แตะ web/ จะ merge ไม่ได้)
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  lint-and-test:
    name: Web / lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test --if-present
