name: Backend CI

on:
  # ไม่กรอง paths ที่ pull_request — ต้องให้ check "Backend / lint-and-test" รายงานผลทุก PR
  # เพราะถูกตั้งเป็น required status check บน main (ไม่งั้น PR ที่ไม่แตะ backend/ จะ merge ไม่ได้)
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    name: Backend / lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gps_user
          POSTGRES_PASSWORD: gps_password
          POSTGRES_DB: gps_config_firmware_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gps_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gps_user:gps_password@localhost:5432/gps_config_firmware_test
      DATABASE_URL_TEST: postgresql://gps_user:gps_password@localhost:5432/gps_config_firmware_test
      REDIS_URL: redis://localhost:6379
      LEGACY_SYNC_MODE: mock
      JWT_SECRET: ci-test-secret
      # Object Storage (Firmware, Sprint 3 #23) — FirmwareStorageService ไม่มี
      # mock mode (ดู comment ในไฟล์นั้น) เชื่อม MinIO จริงเสมอ ต้องมี service
      # จริงให้เชื่อมใน CI ด้วย (ดู step "Start MinIO" ด้านล่าง — GitHub Actions
      # `services:` ไม่รองรับ command override ที่ image quay.io/minio/minio ต้องการ
      # `server /data` เลยต้อง docker run เองแทนที่จะประกาศเป็น services:)
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_ACCESS_KEY: gps_minio_admin
      OBJECT_STORAGE_SECRET_KEY: gps_minio_password
      OBJECT_STORAGE_BUCKET: gps-firmware-ci

    steps:
      # fetch-depth: 0 (ประวัติเต็ม ไม่ใช่ shallow clone) — ต้องมีให้ step
      # "Run Prisma migrations" หา migration ที่ "ใหม่จริง" เทียบกับ main
      # ก่อนหน้าผ่าน git diff ได้ (Issue #158 — เดิม sort ชื่อไฟล์อย่างเดียว
      # เลือกผิดตัวได้ถ้า migration หลาย PR merge ไม่เรียง timestamp)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start MinIO
        run: |
          # Docker Hub เลิกให้ pull image `minio/minio` แบบ anonymous แล้ว
          # (เจอ "pull access denied" ตั้งแต่ ก.ย. 2569 เป็นต้นมา ไม่ใช่แค่
          # rate-limit ชั่วคราว) ย้ายไปดึงจาก quay.io/minio/minio แทน — เช็ค
          # tag จริงจาก https://quay.io/api/v1/repository/minio/minio/tag/
          # ก่อน pin เสมอ (tag ที่ pin ไว้ก่อนหน้า RELEASE.2025-10-15T17-29-55Z
          # ไม่มีอยู่จริงบน quay.io — "manifest unknown" — เป็น tag ที่เดาขึ้น
          # ไม่ได้เช็ค registry จริงก่อน)
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=gps_minio_admin \
            -e MINIO_ROOT_PASSWORD=gps_minio_password \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data --console-address ":9001"

          echo "รอ MinIO พร้อมใช้งาน..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO พร้อมแล้ว"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO ไม่พร้อมภายในเวลาที่กำหนด"
          docker logs minio
          exit 1

      - name: Lint
        run: npm run lint

      - name: Run Prisma migrations
        env:
          # SHA ของ main "ก่อน" การเปลี่ยนแปลงรอบนี้ — ใช้หา migration ที่ "ใหม่จริง"
          # ผ่าน git diff แทนการ sort ชื่อไฟล์ (Issue #158) · pull_request: SHA ของ
          # main ตอนที่ PR เปิด/sync ล่าสุด · push (เข้า main โดยตรงหลัง merge): SHA
          # ของ main ก่อนหน้า push นี้ (`github.event.before`)
          MIGRATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ ! -f prisma/schema.prisma ]; then
            echo "No prisma/schema.prisma yet — skipping (Prisma not added to backend yet)"
            exit 0
          fi

          MIGRATION_COUNT=$(ls -1 prisma/migrations | grep -v migration_lock.toml | wc -l)

          if [ "$MIGRATION_COUNT" -le 1 ]; then
            npx prisma migrate deploy
            exit 0
          fi

          # เจอบั๊กจริง (2026-08-28, kittiphong รีวิว PR role-as-table): migration ที่
          # เปลี่ยน schema แบบไม่ backfill ข้อมูลก่อน ผ่าน CI ได้เพราะ CI เดิม migrate
          # deploy บน DB ว่างเปล่าเท่านั้น ไม่เคยมีข้อมูลให้พังให้เห็น — false positive
          #
          # แก้โดยแยก deploy เป็น 2 รอบ: รอบแรก deploy ทุก migration "ยกเว้นตัวล่าสุด"
          # แล้วใส่ข้อมูลจำลองเข้าไปตรงๆ ด้วย raw SQL (จำลอง DB ที่มีข้อมูลอยู่แล้วก่อน
          # migration ใหม่จะรัน) จากนั้นค่อย deploy migration ล่าสุดทับ ถ้า migration
          # ล่าสุดไม่ backfill ข้อมูลเดิมให้ถูกต้อง จะ fail ตรงนี้ทันที
          #
          # หมายเหตุสำคัญ: ใช้ raw SQL แทน `npx prisma db seed` เพราะ seed.ts ผูกกับ
          # Prisma Client ของ schema.prisma "เวอร์ชันล่าสุด" เสมอ — ถ้า DB ยัง deploy
          # migration ไม่ครบ (จงใจดึงตัวล่าสุดออก) แล้วเรียก seed.ts จะ fail เพราะ
          # ตาราง/คอลัมน์ที่ client คาดหวังยังไม่มีจริงใน DB ตอนนั้น
          #
          # อัปเดต (2026-08-31, PR #38 review): ตั้งแต่ migration role_as_table
          # (2026-08-28) เป็นต้นไป User ไม่มีคอลัมน์ "role" (enum) แล้ว — ใช้ "roleId"
          # (FK ไปที่ Role.id) แทน SQL ด้านล่างจึง insert ผ่าน "roleId" โดย subquery
          # หา id ของ Role ที่ code = 'Operation' (Role ถูก seed มาแล้วตั้งแต่ภายใน
          # migration role_as_table เอง ดังนั้นมีข้อมูลให้ query ได้แน่นอนตรงจุดนี้)
          #
          # ข้อจำกัดเดิมยังอยู่: SQL นี้ผูกกับโครงตาราง "User" ก่อนหน้า migration ล่าสุด
          # ตัวใหม่เสมอ — ถ้ามี migration ใหม่ในอนาคตที่แก้ตาราง User/Role เพิ่มอีก (เช่น
          # เปลี่ยนชื่อคอลัมน์ roleId, เพิ่ม NOT NULL คอลัมน์ใหม่) ต้องอัปเดต SQL นี้ให้
          # ตรงกับโครงตาราง "ก่อน" migration ล่าสุดตัวใหม่ด้วย ไม่งั้น insert นี้จะ fail
          # แทน (เห็นชัดว่าต้องแก้ ไม่ใช่ false negative แบบเงียบๆ)
          #
          # อัปเดต (2026-09-14, PR #151 review): เพิ่ม smoke row ให้ตาราง "Firmware" ด้วย
          # ในลักษณะเดียวกัน — PR #151 เพิ่มคอลัมน์ NOT NULL แบบไม่มี default (objectKey,
          # originalFilename, fileSizeBytes) ลงในตาราง Firmware ที่มีอยู่แล้ว ถ้าไม่มี smoke
          # row ตรงนี้ CI จะผ่านได้เพราะ DB ว่างเปล่าเหมือนบั๊กเดิมของ User table ทุกประการ
          # โครงตาราง Firmware "ก่อน" migration ล่าสุดมีแค่ id, version,
          # deviceModelCompatibility, uploadStatus, deviceUpdateStatus, uploadedBy,
          # uploadedAt — insert หลัง User เพราะ uploadedBy อ้าง FK ไปที่ User.id ที่ insert
          # ไว้ก่อนหน้า (ใช้ id เดียวกับ smoke user ด้านบน) เช่นเดียวกับกฎของ User table: ถ้า
          # มี migration ใหม่ในอนาคตที่แก้โครงตาราง Firmware เพิ่ม ต้องอัปเดต SQL นี้ให้ตรงกับ
          # โครงตาราง "ก่อน" migration ล่าสุดตัวใหม่ด้วยเสมอ
          #
          # อัปเดต (2026-09-16, Issue #158): เดิม hold-back แค่ "ตัวล่าสุดตาม sort ชื่อ
          # ไฟล์" ตัวเดียว — ถ้า 2 PR migration merge เข้า main ไม่เรียงตาม timestamp
          # ที่สร้าง (เช่น PR #153 สร้างทีหลังแต่ merge ก่อน PR #151) จะเลือกผิดตัว แล้ว
          # migration ที่ควรถูกทดสอบจริงๆ (ของ PR ที่ merge เข้ามาทีหลัง) จะไม่เคยผ่าน
          # safety-net นี้เลย ไม่ใช่แค่รอบนั้นพลาด แต่หลุดถาวร
          #
          # แก้โดยหา migration ที่ "ใหม่จริง" ทั้งหมดเทียบกับ main ก่อนหน้าผ่าน git diff
          # (ไม่ใช่ sort ชื่อไฟล์) แล้ว hold-back + ทดสอบทุกตัวพร้อมกันเป็นชุดเดียว แทนที่
          # จะเลือกมาแค่ 1 ตัว — ยังคงหลักการเดิมทุกอย่าง (deploy ทุกอย่าง "ก่อน" ชุดใหม่
          # → ใส่ smoke data จำลอง DB ที่มีข้อมูลอยู่แล้ว → deploy ชุดใหม่ทับ) แค่เปลี่ยน
          # จำนวนที่ hold-back จาก 1 เป็น N
          #
          # อัปเดต (2026-09-18, PR #186 review — เจอตอนหา CI failure ของ Campaign
          # Approval): migration `20260917084641_add_firmware_approval_status` (PR #179,
          # merge เข้า main ก่อน PR นี้) มี `ALTER COLUMN ... DROP DEFAULT` บน
          # `objectKey`/`originalFilename`/`fileSizeBytes` — 3 คอลัมน์นี้เป็น NOT NULL
          # มาตั้งแต่ PR #151 แต่ตอนนั้นยังมี DEFAULT อยู่ (INSERT ด้านล่างที่ไม่ระบุ 3
          # คอลัมน์นี้เลยผ่านได้) พอ default ถูกถอดออกใน main แล้ว "โครงตาราง Firmware
          # ก่อน migration ล่าสุดตัวใหม่" (ของทุก PR ถัดจากนี้ที่ migration ใหม่ไม่ใช่ตัว
          # แตะ Firmware เอง) จึงต้องระบุ 3 คอลัมน์นี้เสมอ ไม่งั้นชน NOT NULL constraint
          # ตรงๆ — เพิ่มเข้า INSERT ด้านล่างแล้ว ตามกฎเดิมที่ comment ด้านบนวางไว้ (ต้อง
          # อัปเดต SQL นี้ทุกครั้งที่โครงตาราง Firmware "ก่อน" migration ล่าสุดเปลี่ยน)
          #
          # อัปเดต (2026-09-23, issue #212): เพิ่ม smoke row ให้ตาราง "DeviceModel"/"Device"
          # ด้วย — ไม่เคยมีมาก่อนเลยตั้งแต่กลไกนี้ถูกสร้าง (มีแค่ User/Firmware) migration
          # ในอนาคตที่แตะ Device (เช่น เพิ่ม NOT NULL column/FK constraint ใหม่แบบเดียวกับที่
          # #209 ทำกับ modelId) จะไม่เคยถูก smoke-test จริงเลยถ้าไม่มีแถวนี้ — โครงตาราง
          # DeviceModel/Device "ก่อน" migration ล่าสุดตัวใหม่ (ปัจจุบันคือหลัง #209: modelId
          # เป็น NOT NULL FK ไป DeviceModel แล้ว) DeviceModel insert ต้องมาก่อน Device เสมอ
          # (FK constraint) — เช่นเดียวกับกฎเดิม: ถ้ามี migration ใหม่ในอนาคตที่แก้โครงตาราง
          # นี้เพิ่ม ต้องอัปเดต SQL นี้ให้ตรงกับโครงตาราง "ก่อน" migration ล่าสุดตัวใหม่ด้วย
          if [ -z "$MIGRATION_BASE_SHA" ] || ! git cat-file -e "$MIGRATION_BASE_SHA" 2>/dev/null; then
            # Fallback: หา base SHA ไม่ได้ (เช่น push แรกสุดของ branch, before SHA
            # เป็น all-zero) — ไม่ใช่เคสปกติของ main แต่กัน CI พังทั้งขบวนไว้ก่อน โดย
            # ถอยไปใช้พฤติกรรมเดิม (hold-back ตัวเดียวตาม sort) ดีกว่าไม่ทดสอบอะไรเลย
            echo "::warning::หา MIGRATION_BASE_SHA ไม่ได้ ($MIGRATION_BASE_SHA) — ใช้ fallback hold-back ตัวล่าสุดตาม sort ชื่อไฟล์แทน"
            NEW_MIGRATIONS=$(ls -1 prisma/migrations | grep -v migration_lock.toml | sort | tail -n 1)
          else
            # `|| true` ท้ายสุด — เคสปกติที่สุด (ไม่มี migration ใหม่เลย) ทำให้
            # `grep -v` ไม่เจออะไรให้ผ่านเลยคืน exit 1 ซึ่งภายใต้ `bash -eo pipefail`
            # ของ GitHub Actions default shell จะทำให้ step ทั้งก้อนพังไปดื้อๆ ทันที
            # (ทดสอบยืนยันแล้วว่าเป็นแบบนี้จริง ไม่ใช่แค่ทฤษฎี) ต้องกัน exit code
            # ของ pipeline นี้ไว้เอง แล้วให้เช็ค "ว่างไหม" ที่เงื่อนไขถัดไปแทน
            NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A "$MIGRATION_BASE_SHA" HEAD -- prisma/migrations/ \
              | grep -v migration_lock.toml \
              | awk -F/ '{print $(NF-1)}' \
              | sort -u || true)
          fi

          NEW_MIGRATION_COUNT=$(echo "$NEW_MIGRATIONS" | grep -c . || true)

          if [ -z "$NEW_MIGRATIONS" ] || [ "$NEW_MIGRATION_COUNT" -ge "$MIGRATION_COUNT" ]; then
            # ไม่เจอ migration ใหม่เทียบกับ base (เช่น PR นี้ไม่ได้เพิ่ม migration เอง
            # แค่ sync main ที่มี migration จาก PR อื่นมาแล้ว) หรือ migration ที่มีอยู่
            # ทั้งหมด "ใหม่" หมดพร้อมกัน (ไม่มี migration เดิมเหลือให้เป็น "ข้อมูลก่อน
            # หน้า" ให้ทดสอบด้วยเลย — เท่ากับไม่มี existing data ให้ป้องกัน) — ไม่มี
            # อะไรต้อง hold-back ในเคสนี้
            echo "ไม่พบ migration เดิมให้ทดสอบย้อนหลังด้วย (เทียบกับ $MIGRATION_BASE_SHA) — deploy ตามปกติ"
            npx prisma migrate deploy
            exit 0
          fi

          echo "Testing migrations against existing data:"
          echo "$NEW_MIGRATIONS"

          mkdir -p /tmp/held-migrations
          while IFS= read -r m; do
            mv "prisma/migrations/$m" /tmp/held-migrations/
          done <<< "$NEW_MIGRATIONS"

          npx prisma migrate deploy

          npx prisma db execute --url "$DATABASE_URL" --stdin <<'SQL'
          INSERT INTO "User" ("id", "username", "passwordHash", "fullName", "roleId", "updatedAt")
          VALUES ('11111111-1111-1111-1111-111111111111', 'ci.smoke.user', 'x', 'CI Smoke User', (SELECT id FROM "Role" WHERE code = 'Operation'), CURRENT_TIMESTAMP);
          INSERT INTO "Firmware" ("id", "version", "deviceModelCompatibility", "uploadStatus", "deviceUpdateStatus", "objectKey", "originalFilename", "fileSizeBytes", "uploadedBy", "uploadedAt")
          VALUES ('22222222-2222-2222-2222-222222222222', 'ci-smoke-1.0.0', ARRAY['CI-TEST-MODEL'], 'pending', 'unknown', 'firmware/ci-smoke/fw.bin', 'ci-smoke.bin', 1024, '11111111-1111-1111-1111-111111111111', CURRENT_TIMESTAMP);
          INSERT INTO "DeviceModel" ("id", "name", "supportedProtocols", "updatedAt")
          VALUES ('33333333-3333-3333-3333-333333333333', 'CI-SMOKE-MODEL', ARRAY['TCP'], CURRENT_TIMESTAMP);
          INSERT INTO "Device" ("id", "deviceId", "simNumber", "deviceModel", "protocol", "modelId")
          VALUES ('44444444-4444-4444-4444-444444444444', 'CI-SMOKE-DEVICE-001', 'ci-smoke-sim', 'CI-SMOKE-MODEL', 'TCP', '33333333-3333-3333-3333-333333333333');
          SQL

          while IFS= read -r m; do
            mv "/tmp/held-migrations/$m" prisma/migrations/
          done <<< "$NEW_MIGRATIONS"

          npx prisma migrate deploy

      - name: Test (unit)
        run: npm test --if-present

      - name: Test (integration — real postgres)
        run: npm run test:integration

      - name: Build
        run: npm run build