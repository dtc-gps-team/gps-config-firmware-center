name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gps_user
          POSTGRES_PASSWORD: gps_password
          POSTGRES_DB: gps_config_firmware_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gps_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gps_user:gps_password@localhost:5432/gps_config_firmware_test
      REDIS_URL: redis://localhost:6379
      LEGACY_SYNC_MODE: mock
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Prisma migrations
        run: npx prisma migrate deploy --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build
