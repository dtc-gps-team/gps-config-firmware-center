name: Backend CI

on:
  # ไม่กรอง paths ที่ pull_request — ต้องให้ check "Backend / lint-and-test" รายงานผลทุก PR
  # เพราะถูกตั้งเป็น required status check บน main (ไม่งั้น PR ที่ไม่แตะ backend/ จะ merge ไม่ได้)
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    name: Backend / lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gps_user
          POSTGRES_PASSWORD: gps_password
          POSTGRES_DB: gps_config_firmware_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gps_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gps_user:gps_password@localhost:5432/gps_config_firmware_test
      DATABASE_URL_TEST: postgresql://gps_user:gps_password@localhost:5432/gps_config_firmware_test
      REDIS_URL: redis://localhost:6379
      LEGACY_SYNC_MODE: mock
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Prisma migrations
        run: |
          if [ ! -f prisma/schema.prisma ]; then
            echo "No prisma/schema.prisma yet — skipping (Prisma not added to backend yet)"
            exit 0
          fi

          MIGRATION_COUNT=$(ls -1 prisma/migrations | grep -v migration_lock.toml | wc -l)

          if [ "$MIGRATION_COUNT" -le 1 ]; then
            npx prisma migrate deploy
            exit 0
          fi

          # เจอบั๊กจริง (2026-08-28, kittiphong รีวิว PR role-as-table): migration ที่
          # เปลี่ยน schema แบบไม่ backfill ข้อมูลก่อน ผ่าน CI ได้เพราะ CI เดิม migrate
          # deploy บน DB ว่างเปล่าเท่านั้น ไม่เคยมีข้อมูลให้พังให้เห็น — false positive
          #
          # แก้โดยแยก deploy เป็น 2 รอบ: รอบแรก deploy ทุก migration "ยกเว้นตัวล่าสุด"
          # แล้วใส่ข้อมูลจำลองเข้าไปตรงๆ ด้วย raw SQL (จำลอง DB ที่มีข้อมูลอยู่แล้วก่อน
          # migration ใหม่จะรัน) จากนั้นค่อย deploy migration ล่าสุดทับ ถ้า migration
          # ล่าสุดไม่ backfill ข้อมูลเดิมให้ถูกต้อง จะ fail ตรงนี้ทันที
          #
          # หมายเหตุสำคัญ: ใช้ raw SQL แทน `npx prisma db seed` เพราะ seed.ts ผูกกับ
          # Prisma Client ของ schema.prisma "เวอร์ชันล่าสุด" เสมอ — ถ้า DB ยัง deploy
          # migration ไม่ครบ (จงใจดึงตัวล่าสุดออก) แล้วเรียก seed.ts จะ fail เพราะ
          # ตาราง/คอลัมน์ที่ client คาดหวังยังไม่มีจริงใน DB ตอนนั้น
          #
          # ข้อจำกัด: SQL ด้านล่าง insert ลงตาราง "User" ตามโครงก่อนหน้า migration
          # role_as_table (คอลัมน์ role เป็น enum เดิม) — ถ้ามี migration ใหม่ในอนาคตที่
          # แก้ตาราง User/คอลัมน์อื่นอีก ต้องอัปเดต SQL นี้ให้ตรงกับโครงตาราง "ก่อน"
          # migration ล่าสุดตัวใหม่ด้วย ไม่งั้น insert นี้จะ fail แทน (เห็นชัดว่าต้องแก้
          # ไม่ใช่ false negative แบบเงียบๆ)
          LATEST_MIGRATION=$(ls -1 prisma/migrations | grep -v migration_lock.toml | sort | tail -n 1)
          echo "Testing latest migration against existing data: $LATEST_MIGRATION"

          mkdir -p /tmp/held-migration
          mv "prisma/migrations/$LATEST_MIGRATION" /tmp/held-migration/

          npx prisma migrate deploy

          npx prisma db execute --url "$DATABASE_URL" --stdin <<'SQL'
          INSERT INTO "User" ("id", "username", "passwordHash", "fullName", "role", "updatedAt")
          VALUES ('11111111-1111-1111-1111-111111111111', 'ci.smoke.user', 'x', 'CI Smoke User', 'Operation', CURRENT_TIMESTAMP);
          SQL

          mv "/tmp/held-migration/$LATEST_MIGRATION" prisma/migrations/
          npx prisma migrate deploy

      - name: Test (unit)
        run: npm test --if-present

      - name: Test (integration — real postgres)
        run: npm run test:integration

      - name: Build
        run: npm run build