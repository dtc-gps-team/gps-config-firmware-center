name: Backend CI

on:
  # ไม่กรอง paths ที่ pull_request — ต้องให้ check "Backend / lint-and-test" รายงานผลทุก PR
  # เพราะถูกตั้งเป็น required status check บน main (ไม่งั้น PR ที่ไม่แตะ backend/ จะ merge ไม่ได้)
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    name: Backend / lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gps_user
          POSTGRES_PASSWORD: gps_password
          POSTGRES_DB: gps_config_firmware_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gps_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gps_user:gps_password@localhost:5432/gps_config_firmware_test
      DATABASE_URL_TEST: postgresql://gps_user:gps_password@localhost:5432/gps_config_firmware_test
      REDIS_URL: redis://localhost:6379
      LEGACY_SYNC_MODE: mock
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Prisma migrations
        run: |
          if [ ! -f prisma/schema.prisma ]; then
            echo "No prisma/schema.prisma yet — skipping (Prisma not added to backend yet)"
            exit 0
          fi

          MIGRATION_COUNT=$(ls -1 prisma/migrations | grep -v migration_lock.toml | wc -l)

          if [ "$MIGRATION_COUNT" -le 1 ]; then
            npx prisma migrate deploy
            exit 0
          fi

          LATEST_MIGRATION=$(ls -1 prisma/migrations | grep -v migration_lock.toml | sort | tail -n 1)
          echo "Testing latest migration against seeded data: $LATEST_MIGRATION"

          mkdir -p /tmp/held-migration
          mv "prisma/migrations/$LATEST_MIGRATION" /tmp/held-migration/

          npx prisma migrate deploy
          npx prisma db seed

          mv "/tmp/held-migration/$LATEST_MIGRATION" prisma/migrations/
          npx prisma migrate deploy

      - name: Test (unit)
        run: npm test --if-present

      - name: Test (integration — real postgres)
        run: npm run test:integration

      - name: Build
        run: npm run build
