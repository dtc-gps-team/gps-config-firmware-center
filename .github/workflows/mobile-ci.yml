name: Mobile CI

on:
  # ไม่กรอง paths ที่ pull_request — ต้องให้ check "Mobile / lint-and-test" รายงานผลทุก PR
  # เพราะถูกตั้งเป็น required status check บน main (ไม่งั้น PR ที่ไม่แตะ mobile/ จะ merge ไม่ได้)
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  lint-and-test:
    name: Mobile / lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # ตรึงเวอร์ชันไว้ ไม่ใช้ stable ล่าสุดเสมอ: 3.50.0 (12 พ.ย. 2569) เลิกใช้
          # package:flutter/material.dart (ย้ายไป material_ui) ทำให้ flutter analyze
          # ล้มด้วย info deprecated_member_use 102 จุด ทั้งที่โค้ดไม่ได้เปลี่ยน ·
          # 3.47.9 = เวอร์ชันที่ main ผ่านล่าสุด (วิเคราะห์โดย A ใน #476) · ขยับเมื่อ
          # ทีมอัป Flutter ในเครื่องและย้ายโค้ดตามเวอร์ชันใหม่แล้ว
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (lint)
        run: flutter analyze

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      # แอป default เป็น mock (CLAUDE.md Mock Mode Pattern) รันทั้งสองโหมด —
      # เทสเฉพาะโหมดจริงถูก skip ในรอบแรกและรันในรอบที่สอง
      - name: Test (mock mode — default)
        run: flutter test

      - name: Test (real mode — API_MOCK_MODE=false)
        run: flutter test --dart-define=API_MOCK_MODE=false
