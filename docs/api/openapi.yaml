openapi: 3.0.3
info:
  title: GPS Config & Firmware Center API
  description: >
    โครง API เริ่มต้นสำหรับ Sprint 0 — ยังไม่ครบทุก Endpoint
    เพิ่มเติมทีละ Phase ตามที่ Build จริง (ดู ../planning/01_GPS_Build_Reference.md Section 3)
  version: "0.1.0"
servers:
  - url: http://localhost:3001/api/v1
    description: Local dev

# บังคับ Bearer JWT ทุก endpoint โดย default — override เป็น security: [] เฉพาะ endpoint ที่เป็น public
security:
  - bearerAuth: []

tags:
  - name: auth
    description: Login และการยืนยันตัวตน (JWT)
  - name: config
    description: จัดการ Device Config — สร้าง/นำเข้า/ทดสอบ/อนุมัติ
  - name: config-deletion
    description: >-
      คำขอลบ Config อัตโนมัติ (docs/11 Part A) — scheduled job เสนอลบ Config
      ที่ค้างไม่ใช้ · SuperAdmin อนุมัติ/ปฏิเสธ · ConfigEngineer/ผู้สร้างกด "เก็บไว้"
  - name: config-override
    description: >-
      Per-Field Config Override ACL (issue #185) — ST แก้ค่าบาง field ของ
      Config ที่ approved/synced แล้วโดยตรง ไม่ผ่าน Approval Center ปกติ
      (กรณีลูกค้าขอแก้ค่าหน้างาน หรือช่างต้องแก้เพราะเกิดข้อผิดพลาด) OT ไม่มี
      สิทธิ์เลย — เฉพาะ field ที่ ConfigEngineer เปิด `stOverridable: true` ไว้
      ใน Parameter Library เท่านั้น
  - name: firmware
    description: อัปโหลดและทดสอบ Firmware ของกล่อง
  - name: device-status
    description: สถานะ Config และ Firmware รายกล่อง
  - name: device
    description: การทำงานกับตัวกล่อง — ทดสอบการเชื่อมต่อ/สัญญาณ
  - name: device-model
    description: >-
      DeviceModel registry (issue #209, docs/15) — canonical registry ของ
      "รุ่นสินค้า" แทน string อิสระเดิมที่กระจายอยู่ในหลายตาราง สร้าง/แก้ได้
      แค่ Admin/SuperAdmin (master/reference data) อ่านเปิดกว้างให้ทุก role
      ที่ login แล้ว
  - name: task
    description: มอบหมาย/ติดตามงานให้ทีมช่างหน้างาน (เชื่อมกับ Mobile app)
  - name: notification
    description: Notification ของ user ปัจจุบัน — list และ mark อ่านแล้ว
  - name: incident
    description: >-
      รายการเหตุการณ์ผิดปกติ (Incident) — รอบนี้ read-only เท่านั้น
      ดูรายการ/รายละเอียด · Create ยังเป็นแค่ auto จาก config-sync-writer
  - name: audit
    description: >-
      ประวัติการทำงานแบบ mutation-only (สร้าง/แก้ไข/อนุมัติ/ปฏิเสธ/นำ Config
      ไปใช้ ฯลฯ) — Sprint 3 #27, read-only เท่านั้น การเขียนไม่มี endpoint ตรง
      (แต่ละโมดูลเขียนเองตอนเกิด mutation) · read-level activity (เปลี่ยนหน้า/
      เสิร์ช) ไม่อยู่ในนี้ — ดู CLAUDE.md Audit Pattern
  - name: user
    description: >-
      รายชื่อ user แบบย่อ (id + ชื่อ + role) — สำหรับ dropdown "เจาะจงผู้อนุมัติ"
      ใน Approval Center · **ไม่ใช่** จอ User / Role Management (Admin เท่านั้น,
      ยังไม่มีใน spec)
  - name: campaign
    description: >-
      Campaign (Sprint 3 #21) — กลุ่มอุปกรณ์ถาวรสำหรับติดตาม/บำรุงรักษาเป็น
      กลุ่ม **ไม่ใช่เครื่องมือมอบหมายงานให้ช่างหน้างาน** (การมอบหมายงานเป็น
      หน้าที่ของระบบแยกที่บริษัทมีอยู่แล้ว — แก้ไข 2026-09-14) · **แก้ไข
      2026-09-24 (Campaign Monitor #22 — แยกกลุ่มออกจากรอบ push):** เดิม 1
      Campaign ผูก payload+approval+target ไว้ก้อนเดียว ยิงได้ครั้งเดียวจบ —
      เปลี่ยนเป็นกลุ่มอยู่ยาว ผูก `CampaignRollout` (1 รอบ push Config หรือ
      Firmware เข้ากลุ่ม) ได้หลายรอบตลอดอายุกลุ่ม **รันได้ทีละรอบเท่านั้น**
      ต่อกลุ่ม — ผลต่อเครื่องของแต่ละรอบติดตามผ่าน `CampaignRolloutTarget`
      (อัปเดตจาก `applyConfigToDevice`/`confirmFirmwareInstall` จริง)

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login ด้วย Username/Password
      security: []   # public — ยังไม่มี token ตอนเรียก login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login สำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Username/Password ไม่ถูกต้อง

  /config:
    get:
      tags: [config]
      operationId: listConfigs
      summary: ดึงรายการ Config ทั้งหมด (แบ่งตาม status)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, testing, approved, rejected, synced]
      responses:
        "200":
          description: รายการ Config
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceConfigDraft"
        "400":
          description: ค่า query parameter status ไม่ถูกต้อง
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
    post:
      tags: [config]
      operationId: createConfig
      summary: สร้าง Config ใหม่ผ่านฟอร์ม (Draft)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigWriteInput"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "400":
          description: ข้อมูล Config ไม่ถูกต้อง (validation ตาม Config Definition Lookup)
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์สร้าง Config — เฉพาะ Role ConfigEngineer เท่านั้น
        "409":
          description: มี Config ชื่อนี้อยู่แล้ว — ชื่อ Config ต้อง unique ทั้งระบบ

  # เพิ่มใหม่: GET/PUT/DELETE Config รายตัว (เดิมมีแค่ list/create/import/
  # simulate/approve/reject)
  /config/{configId}:
    get:
      tags: [config]
      operationId: getConfig
      summary: ดึงรายละเอียด Config รายตัว
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: รายละเอียด Config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ Config นี้
    put:
      tags: [config]
      operationId: updateConfig
      summary: แก้ไข Config ที่ยังเป็นสถานะ draft
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigWriteInput"
      responses:
        "200":
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "400":
          description: ข้อมูล Config ไม่ถูกต้อง (validation ตาม Config Definition Lookup)
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์แก้ไข Config — เฉพาะ Role ConfigEngineer เท่านั้น
        "404":
          description: ไม่พบ Config นี้
        "409":
          description: สถานะ Config ปัจจุบันไม่ใช่ draft จึงแก้ไขไม่ได้ หรือชื่อใหม่ซ้ำกับ Config อื่น
    delete:
      tags: [config]
      operationId: deleteConfig
      summary: ลบ Config ที่ยังเป็นสถานะ draft
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: ลบสำเร็จ
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ลบ Config — เฉพาะ Role ConfigEngineer เท่านั้น
        "404":
          description: ไม่พบ Config นี้
        "409":
          description: สถานะ Config ปัจจุบันไม่ใช่ draft จึงลบไม่ได้

  /config/import:
    post:
      tags: [config]
      operationId: importConfig
      summary: Import Config จากไฟล์ (v3.2 — รองรับ JSON เป็นจุดเริ่มต้น)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                format:
                  type: string
                  enum: [json]
      responses:
        "201":
          description: Import สำเร็จ แปลงเป็น DeviceConfigDraft แล้ว เข้า flow ทดสอบ/อนุมัติเดียวกับฟอร์ม
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "400":
          description: >-
            ไฟล์หรือ format ไม่ถูกต้อง (รองรับเฉพาะ JSON) หรือแปลงเป็น
            DeviceConfigDraft ไม่สำเร็จ (รวมถึงไฟล์ไม่มี field name)
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ Import Config — เฉพาะ Role ConfigEngineer เท่านั้น
        "409":
          description: มี Config ชื่อนี้อยู่แล้ว — ชื่อ Config ต้อง unique ทั้งระบบ
        "413":
          description: ไฟล์มีขนาดเกิน limit ที่กำหนดไว้ (1MB)

  /config/{configId}/simulate:
    post:
      tags: [config]
      operationId: simulateConfig
      summary: ทดสอบ Config กับ Device Simulator (ใช้ทั้งฝั่ง Web และ Mobile — v3.5)
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      requestBody:
        # required: false (v3.9 — แก้ตาม code review ของ kittiphong บน PR
        # Stage 3: ConfigController.simulate ไม่รับ @Body() เลยจริงๆ — เดิม
        # required: true ทำให้ client ที่ gen จาก spec ตรงๆ ถูกบังคับส่ง body
        # ที่ backend ไม่สนใจอยู่ดี ส่วน `deviceModel` ใน schema ก็ไม่ถูกใช้
        # เลย (ConfigService.simulate ใช้ deviceModel/protocol/fields จาก DB
        # ของ Config นั้นเสมอ ไม่รับจาก client) เก็บ property นี้ไว้เป็นข้อมูล
        # อ้างอิงเฉยๆ
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceModel:
                  type: string
      responses:
        "200":
          description: ผลทดสอบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "400":
          description: deviceModel ไม่ถูกต้องหรือไม่รองรับ
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ทดสอบ Config นี้ — เฉพาะ Role ConfigEngineer, Operation, ST, OT
        "404":
          description: ไม่พบ Config นี้
        "409":
          description: สถานะ Config ปัจจุบันไม่รองรับการทดสอบ (เช่น approved/synced ไปแล้ว)

  /config/{configId}/decide:
    post:
      tags: [config]
      operationId: decideConfig
      summary: ConfigEngineer ปักผลตัดสินใจผ่าน/ไม่ผ่านเองหลังดูผล simulate แล้ว (Stage 4 · v3.19 — +suggestedApproverId)
      description: >-
        `passed:true` เปลี่ยนสถานะจาก draft เป็น testing (ส่งต่อให้ Operation
        อนุมัติ/ปฏิเสธต่อ) — `passed:false` ไม่เปลี่ยนสถานะเลย (ยังเป็น draft
        เหมือนเดิม ให้ ConfigEngineer แก้ไขต่อได้) · ส่ง `suggestedApproverId` (optional,
        เฉพาะตอน passed:true) เพื่อเจาะจง Operation ที่อยากให้ดูเป็นพิเศษ —
        ไม่ผูกมัด Operation คนอื่นก็ approve ได้ (Approval Center — Sprint 3 #19)
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passed]
              properties:
                passed:
                  type: boolean
                suggestedApproverId:
                  type: string
                  format: uuid
                  description: >-
                    user id ของ Operation ที่ ConfigEngineer เจาะจง (optional) — ต้องเป็น
                    role Operation ที่ active จริง ไม่งั้น 400
      responses:
        "200":
          description: ปักผลสำเร็จ (ไม่ว่า passed จะเป็น true หรือ false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "400":
          description: >-
            ไม่ส่ง passed มา หรือ passed ไม่ใช่ boolean · หรือ suggestedApproverId
            ไม่ใช่ผู้ใช้ role Operation ที่ active
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ปักผลตัดสินใจ Config — เฉพาะ Role ConfigEngineer เท่านั้น
        "404":
          description: ไม่พบ Config นี้
        "409":
          description: สถานะ Config ปัจจุบันไม่ใช่ draft จึงปักผลตัดสินใจไม่ได้ (เช่น ยังไม่เคย simulate เลย หรือส่งต่อ Operation ไปแล้ว)

  /config/{configId}/approve:
    post:
      tags: [config]
      operationId: approveConfig
      summary: Operation อนุมัติ Config
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: อนุมัติสำเร็จ — เข้า flow config-sync-writer ต่อ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์อนุมัติ Config — เฉพาะ Role Operation เท่านั้น
        "404":
          description: ไม่พบ Config นี้
        "409":
          description: สถานะ Config ปัจจุบันไม่ใช่ testing จึงอนุมัติไม่ได้

  /config/{configId}/reject:
    post:
      tags: [config]
      operationId: rejectConfig
      summary: Operation ปฏิเสธ Config (สถานะย้อนกลับไป Draft ทั้งหมด)
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ปฏิเสธสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ปฏิเสธ Config — เฉพาะ Role Operation เท่านั้น
        "404":
          description: ไม่พบ Config นี้
        "409":
          description: สถานะ Config ปัจจุบันไม่ใช่ testing จึงปฏิเสธไม่ได้

  # เพิ่มใหม่ (issue #185, Phase 1) — Per-Field Config Override: ST แก้ค่าบาง
  # field ของ Config ที่ approved/synced แล้วโดยตรง ข้าม Approval Center ปกติ
  # สร้าง ConfigVersion ใหม่ mirror approveConfig ทุกประการ (เผื่อ Rollback
  # #28 ใช้ต่อ) แค่ actor ไม่ใช่ผู้อนุมัติจริง (ดู description field `reason`)
  /config/{configId}/override:
    post:
      tags: [config-override]
      operationId: overrideConfig
      summary: ST override ค่าบาง field ของ Config ที่ approved/synced แล้ว (Per-Field ACL — issue #185)
      description: >-
        `fields` เป็น partial update — ใส่แค่ field ที่ต้องการแก้ ทุก key ต้อง
        `stOverridable: true` ตาม ConfigFieldDefinition ที่เกี่ยวข้อง ไม่งั้น 400
        · `reason` บังคับกรอกเสมอ (GPS_Config_Firmware_Center_Design.pdf §19
        ข้อ 24: "ทุกการ Override ต้องมีผู้ดำเนินการ เหตุผล และ Audit Log") ·
        สร้าง ConfigVersion ใหม่ทุกครั้ง (versioning เผื่อ Rollback ใช้ต่อ) ·
        เขียน AuditLog บังคับทุกครั้งแบบไม่มีข้อยกเว้น (RBAC_Matrix.md กฎข้อ 3)
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields, reason]
              properties:
                fields:
                  type: object
                  additionalProperties: true
                  description: >-
                    partial update ของ Config.fields — key ต้องมีนิยามใน
                    ConfigFieldDefinition และ stOverridable: true
                reason:
                  type: string
                  maxLength: 500
                  description: เหตุผลของการ override — บังคับกรอกเสมอ
      responses:
        "200":
          description: override สำเร็จ — Config.fields ถูก merge ค่าใหม่เข้าไปแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "400":
          description: >-
            ไม่ส่ง reason มา · หรือมี field ที่ไม่รู้จัก/ไม่รองรับรุ่นอุปกรณ์นี้/
            stOverridable: false/ชนิดข้อมูลไม่ตรง/ค่าไม่อยู่ใน allowedValues
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ override Config — เฉพาะ Role ST เท่านั้น (OT ไม่มีสิทธิ์เลย)
        "404":
          description: ไม่พบ Config นี้
        "409":
          description: สถานะ Config ปัจจุบันไม่ใช่ approved/synced จึง override ไม่ได้

  # เพิ่มใหม่ (Stage 5, #26 ข้อ 9): ประวัติเวอร์ชันของ Config — snapshot
  # append-only ทุกครั้งที่ Operation approve เป็นฐานของ Rollback ใน Phase 4
  /config/{configId}/versions:
    get:
      tags: [config]
      operationId: listConfigVersions
      summary: ดึงประวัติเวอร์ชันทั้งหมดของ Config (เรียงล่าสุดก่อน — v3.12 Stage 5 #26 ข้อ 9)
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: รายการ ConfigVersion (ว่าง = Config ยังไม่เคยถูก approve)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigVersion"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ Config นี้

  /config/{configId}/versions/{versionNumber}:
    get:
      tags: [config]
      operationId: getConfigVersion
      summary: ดึง snapshot เวอร์ชันเดียวตาม versionNumber (v3.12 — ต้นทางของ Rollback Phase 4)
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
        - in: path
          name: versionNumber
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ConfigVersion (มี fields เต็ม — ใช้เป็นต้นทางของ Rollback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigVersion"
        "400":
          description: versionNumber ไม่ใช่จำนวนเต็ม
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ Config นี้ หรือไม่พบเวอร์ชันที่ระบุ

  # เพิ่มใหม่ (docs/11 Part A — คำขอลบ Config อัตโนมัติ): scheduled job รายวัน
  # สร้าง ConfigDeletionRequest ให้ Config ที่เข้าเกณฑ์ §2 · SuperAdmin ดูคิว +
  # approve (soft delete) / reject (Config อยู่ต่อ + cooldown 90 วัน) ·
  # ConfigEngineer หรือผู้สร้างกด keep ระหว่าง grace period 7 วัน -> cancelled
  /config-deletion-requests:
    get:
      tags: [config-deletion]
      operationId: listConfigDeletionRequests
      summary: SuperAdmin ดูคิวคำขอลบ Config (docs/11 §5 — v3.16)
      description: >-
        ไม่ระบุ `status` = `pending` (คิวที่ต้องตัดสิน) · รับค่าอื่น
        (`approved`/`rejected`/`cancelled`) ได้เผื่อหน้าประวัติ
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, cancelled]
      responses:
        "200":
          description: รายการ ConfigDeletionRequest (แนบ config เต็ม)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigDeletionRequest"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ดูคำขอลบ Config — เฉพาะ Role SuperAdmin

  /config-deletion-requests/{id}/approve:
    post:
      tags: [config-deletion]
      operationId: approveConfigDeletionRequest
      summary: SuperAdmin อนุมัติคำขอลบ Config -> soft delete (docs/11 §5 — v3.16)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: อนุมัติสำเร็จ — Config ถูก soft-delete (`deletedAt` != null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDeletionRequest"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์อนุมัติคำขอลบ — เฉพาะ Role SuperAdmin
        "404":
          description: ไม่พบคำขอลบนี้
        "409":
          description: คำขอลบนี้ถูกตัดสินไปแล้ว (สถานะไม่ใช่ pending)

  /config-deletion-requests/{id}/reject:
    post:
      tags: [config-deletion]
      operationId: rejectConfigDeletionRequest
      summary: SuperAdmin ปฏิเสธคำขอลบ Config — Config อยู่ต่อ + cooldown 90 วัน (docs/11 §5 — v3.16)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  maxLength: 500
                  description: เหตุผลที่ไม่อนุมัติให้ลบ — เก็บใน `decisionNote` ให้ผู้สร้างเห็น
      responses:
        "200":
          description: ปฏิเสธสำเร็จ — Config ไม่ถูกแตะ, เข้า cooldown 90 วัน
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDeletionRequest"
        "400":
          description: ไม่ได้ส่ง `note` หรือยาวเกิน 500 ตัวอักษร
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ปฏิเสธคำขอลบ — เฉพาะ Role SuperAdmin
        "404":
          description: ไม่พบคำขอลบนี้
        "409":
          description: คำขอลบนี้ถูกตัดสินไปแล้ว (สถานะไม่ใช่ pending)

  # `keep` key ด้วย config id (ไม่ใช่ request id) — ConfigEngineer/ผู้สร้างได้
  # notification เรื่อง "Config X" ไม่รู้ request id · resource `config` action
  # Update ที่ ConfigEngineer มีอยู่แล้ว (ต่างจาก docs/11 §5 ที่วางเป็น
  # `/config-deletion-requests/{id}/keep` — ปรับ path ให้ตรงกับสิทธิ์/บริบท
  # ผู้ใช้จริง ดู RBAC_Matrix.md §4.2)
  /config/{configId}/deletion-requests/keep:
    post:
      tags: [config-deletion]
      operationId: keepConfigDeletionRequest
      summary: ConfigEngineer / ผู้สร้างกด "เก็บไว้" ระหว่าง grace period -> cancelled + reset นาฬิกา (docs/11 §3 — v3.16)
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: ยกเลิกคำขอลบสำเร็จ — `Config.updatedAt` ถูกแตะใหม่ (reset นาฬิกา 90 วัน)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDeletionRequest"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ — เฉพาะ Role ConfigEngineer
        "404":
          description: ไม่มีคำขอลบที่รอดำเนินการ (pending) สำหรับ Config นี้

  /config-definitions:
    get:
      tags: [config]
      operationId: listConfigDefinitions
      summary: ดึง catalog ของ Config Field Definition ทั้งหมด (Config Definition Lookup — v3.10)
      description: >-
        รายการ field ที่ระบบรู้จัก (ชื่อ field, ชนิดข้อมูล, ค่าที่ยอมรับ,
        บังคับกรอกไหม, รุ่นอุปกรณ์/โปรโตคอลที่ใช้ได้) ใช้อ้างอิงตอนกรอก/ตรวจ
        Config
      responses:
        "200":
          description: รายการ Config Field Definition ทั้งหมด (เรียงตาม fieldName)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigFieldDefinition"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์อ่าน Config Definition — เฉพาะ Role ConfigEngineer, Operation, ST, OT
    post:
      tags: [config]
      operationId: createConfigDefinition
      summary: สร้าง Config Field Definition ใหม่ (Semantic Validation — v3.11)
      description: >-
        ConfigEngineer สร้าง field definition ใหม่ในคลังเอง ไม่ต้องผ่านขั้นตอนอนุมัติ
        เพราะ field ที่มีปัญหาจริงจะโดนจับตอนเอาไปสร้าง Config Template แล้ว
        เข้า simulate/decide/approve อยู่ดี (ตัดสินใจร่วมกับทีมและพี่เลี้ยง
        2569-09 — ดู RBAC_Matrix.md changelog) `supportedModels` ต้องระบุ
        อย่างน้อย 1 คู่ (deviceModel, protocol) เสมอ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConfigDefinitionInput"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigFieldDefinition"
        "400":
          description: ข้อมูลไม่ผ่าน validation (เช่น supportedModels ว่างเปล่า)
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์สร้าง Config Definition — เฉพาะ Role ConfigEngineer
        "409":
          description: มี field ชื่อนี้อยู่แล้วในคลัง (fieldName ซ้ำ)

  /notifications:
    get:
      tags: [notification]
      operationId: listNotifications
      summary: ดึงรายการ Notification ของ user ปัจจุบัน (จาก JWT)
      parameters:
        - in: query
          name: unread
          description: กรองเฉพาะ notification ที่ยังไม่ได้อ่าน (read=false)
          schema:
            type: boolean
      responses:
        "200":
          description: รายการ Notification
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "400":
          description: ค่า query parameter ไม่ถูกต้อง
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ

  /notifications/{notificationId}/read:
    patch:
      tags: [notification]
      operationId: markNotificationRead
      summary: ทำเครื่องหมาย Notification ว่าอ่านแล้ว (read = true)
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: อัปเดตสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ Notification นี้

  /notifications/device-tokens:
    post:
      tags: [notification]
      operationId: registerDeviceToken
      summary: >-
        ลงทะเบียน / อัปเดต FCM device token ของ user ปัจจุบัน (Push Notification
        groundwork — v3.14) — upsert ตาม token, ผูกกับ JWT ไม่รับ userId จาก client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceTokenInput"
      responses:
        "200":
          description: ลงทะเบียน / อัปเดตสำเร็จ (upsert idempotent — ไม่ตอบ 201)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceToken"
        "400":
          description: ข้อมูลไม่ถูกต้อง (token ว่าง / platform ไม่ใช่ android|ios|web)
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ

    delete:
      tags: [notification]
      operationId: deleteDeviceToken
      summary: >-
        ถอนทะเบียน device token (เรียกตอน logout — v3.14) — ลบได้เฉพาะ token
        ของตัวเอง · token เป็น query param (ไม่ใช่ path) เพราะ FCM token มี `/` `:`
        และ path `/device-tokens/{token}` ชนกับ `/{notificationId}/read`
      parameters:
        - in: query
          name: token
          required: true
          description: FCM registration token
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: ถอนทะเบียนสำเร็จ (ไม่มี body)
        "400":
          description: ไม่ได้ระบุ token
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ device token นี้ (หรือเป็นของ user อื่น — ตอบ 404 ไม่เปิดเผย)

  /tasks:
    get:
      tags: [task]
      operationId: listTasks
      summary: ดึงรายการงานทั้งหมด (กรองด้วย status / assignedTo ได้)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, completed, cancelled]
        - in: query
          name: assignedTo
          description: กรองเฉพาะงานของผู้รับผิดชอบคนใดคนหนึ่ง (user id)
          schema:
            type: string
      responses:
        "200":
          description: รายการงาน
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "400":
          description: ค่า query parameter ไม่ถูกต้อง
    post:
      tags: [task]
      operationId: createTask
      summary: สร้างงานใหม่ (status เริ่มต้นเป็น pending)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: สร้างงานสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: ข้อมูลไม่ถูกต้อง (รวมถึง configId ไม่ใช่ uuid)
        "403":
          description: ไม่มีสิทธิ์สร้างงาน — เฉพาะ Role Operation เท่านั้น
        "404":
          description: ไม่พบ Config (configId) ที่ระบุ
        "409":
          description: >-
            configId ที่ระบุยังผูกกับงานไม่ได้ — Config ยังไม่ approved/synced
            หรือ deviceModel/protocol ไม่ตรงกับ Device ของงาน

  /tasks/{taskId}:
    get:
      tags: [task]
      operationId: getTask
      summary: ดึงรายละเอียดงาน 1 รายการ
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: รายละเอียดงาน
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: taskId ไม่ใช่ uuid ที่ถูกต้อง
        "404":
          description: >-
            ไม่พบงานนี้ (รวมถึงกรณี ST/OT พยายามดูงานที่ไม่ใช่ของตัวเอง — ตอบ 404
            แทน 403 เพื่อไม่เปิดเผยว่ามี record นี้อยู่)
    patch:
      tags: [task]
      operationId: updateTask
      summary: แก้ไขงาน (เช่น เปลี่ยน status, ผู้รับผิดชอบ, กำหนดส่ง)
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdateRequest"
      responses:
        "200":
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: ข้อมูลไม่ถูกต้อง (รวมถึง configId ไม่ใช่ uuid)
        "403":
          description: >-
            ไม่มีสิทธิ์แก้ไขงานนี้ — Operation แก้ได้ทุก field, ST/OT แก้ได้เฉพาะ
            field status ของงานที่ตัวเองถูก assign เท่านั้น (role อื่นแก้ไม่ได้เลย
            — ST/OT ที่ส่ง configId มาด้วยก็ถือเป็น 403)
        "404":
          description: >-
            ไม่พบงานนี้ (รวมถึงกรณี ST/OT พยายามแก้งานที่ไม่ใช่ของตัวเอง — ตอบ 404
            แทน 403 เพื่อไม่เปิดเผยว่ามี record นี้อยู่) หรือไม่พบ Config (configId)
            ที่ระบุ
        "409":
          description: >-
            configId ที่ระบุยังผูกกับงานไม่ได้ — Config ยังไม่ approved/synced
            หรือ deviceModel/protocol ไม่ตรงกับ Device ของงาน

  /firmware:
    get:
      tags: [firmware]
      operationId: listFirmware
      summary: รายการ Firmware ที่อัปโหลดเข้าระบบ (v3.23)
      description: ทุก Role ที่ login แล้วเรียกได้ (resource `firmware` action `Read`) เรียงตาม `uploadedAt` desc
      responses:
        "200":
          description: รายการ Firmware
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Firmware"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
    post:
      tags: [firmware]
      operationId: uploadFirmware
      summary: อัปโหลด Firmware เข้าระบบเราโดยตรง (v3.7 — ทางเดียว ไม่มีช่องทางดึงจากระบบเดิมแล้ว · v3.23 implement จริง)
      description: >-
        **FirmwareEngineer เท่านั้น** (resource `firmware` action `Create`) — อัปโหลดไฟล์ขึ้น
        Object Storage (MinIO ตอนนี้ → AWS S3 ตอนใช้งานจริง) แบบ synchronous
        แล้วตั้ง `uploadStatus` ตามผลจริง (`stored`/`failed` — ไม่ throw 500
        ถ้า Object Storage ล้มเหลว) `deviceModel` เดียวตอนอัปโหลดกลายเป็น
        compatibility tag เริ่มต้น (1 รุ่น) — เพิ่ม/แก้รุ่นที่รองรับทีหลังผ่าน
        `PATCH /firmware/{firmwareId}` (Compatibility Tag) แยกต่างหาก · ขนาด
        ไฟล์สูงสุด 50MB
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, version, deviceModel]
              properties:
                file:
                  type: string
                  format: binary
                version:
                  type: string
                deviceModel:
                  type: string
      responses:
        "201":
          description: อัปโหลดสำเร็จ (ไม่ว่า `uploadStatus` จะเป็น `stored` หรือ `failed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "400":
          description: ไม่มีไฟล์แนบมา หรือไม่ระบุ `version`/`deviceModel`
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์อัปโหลด Firmware — เฉพาะ Role FirmwareEngineer เท่านั้น

  /firmware/{firmwareId}:
    get:
      tags: [firmware]
      operationId: getFirmware
      summary: รายละเอียด Firmware 1 รายการ (v3.23)
      description: เหมือน `listFirmware` — resource `firmware` action `Read` เดียวกัน
      parameters:
        - in: path
          name: firmwareId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: ข้อมูล Firmware
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ Firmware นี้
    patch:
      tags: [firmware]
      operationId: updateFirmwareCompatibility
      summary: แก้ Compatibility Tag (v3.23)
      description: >-
        **FirmwareEngineer เท่านั้น** (resource `firmware` action `Update`) — แทนที่
        `deviceModelCompatibility` ทั้ง array เสมอ (ไม่ merge กับของเดิม) แยก
        จากขั้นตอนอัปโหลด ตามชื่อ dev plan แถวที่ 23 "(อัปโหลด + Compatibility Tag)"
      parameters:
        - in: path
          name: firmwareId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceModelCompatibility]
              properties:
                deviceModelCompatibility:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        "200":
          description: อัปเดตสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "400":
          description: deviceModelCompatibility ว่างเปล่า
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์แก้ Compatibility Tag — เฉพาะ Role FirmwareEngineer เท่านั้น
        "404":
          description: ไม่พบ Firmware นี้

  /firmware/{firmwareId}/simulate:
    post:
      tags: [firmware]
      operationId: simulateFirmware
      summary: ทดสอบ Firmware กับ Device Simulator (ใช้ทั้งฝั่ง Web และ Mobile — v3.5 · v3.23 implement จริง)
      description: >-
        FirmwareEngineer/QAEngineer/Operation/ST/OT (resource `firmware-simulation` action `Read` —
        แยกจาก `firmware` ธรรมดา mirror `config`/`config-simulation` กัน
        Auditor/Admin ที่มีแค่ `firmware.Read` เรียกได้โดยไม่ตั้งใจ) mock
        เช็คว่า `deviceModel` ที่ระบุอยู่ใน `deviceModelCompatibility` ของ
        Firmware นี้ไหม (env `FIRMWARE_SIMULATOR_MODE` — ยังไม่มี Device
        Simulator ตัวจริงที่ทดสอบ Firmware ได้) ไม่แตะ `uploadStatus`/state ใดๆ
      parameters:
        - in: path
          name: firmwareId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceModel]
              properties:
                deviceModel:
                  type: string
      responses:
        "200":
          description: ผลทดสอบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "400":
          description: ไม่ระบุ deviceModel
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ทดสอบ Firmware นี้ — เฉพาะ Role FirmwareEngineer, QAEngineer, Operation, ST, OT
        "404":
          description: ไม่พบ Firmware นี้
        "409":
          description: uploadStatus ของ Firmware ปัจจุบันยังไม่พร้อมทดสอบ — ต้องเป็น `stored` เท่านั้น

  /firmware/{firmwareId}/approve:
    post:
      tags: [firmware]
      operationId: approveFirmware
      summary: QAEngineer อนุมัติคุณภาพ Firmware (Firmware Approval Lifecycle — docs/13 §3.2)
      description: >-
        resource แยกเป็น `firmware-decision` action `Approve` (mirror
        `config-decision`) — QAEngineer เท่านั้น · สถานะ `pending_review` →
        `approved` เท่านั้น (ต้องดูผล `simulateFirmware` มาก่อนตามดุลพินิจ QA
        — ไม่มีขั้น "ส่งต่อ" แยกแบบ Config เพราะ QA เป็นผู้ตัดสินใจคนเดียว)
      parameters:
        - in: path
          name: firmwareId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: อนุมัติสำเร็จ — approvalStatus เป็น approved พร้อม approvedBy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์อนุมัติคุณภาพ Firmware — เฉพาะ Role QAEngineer เท่านั้น
        "404":
          description: ไม่พบ Firmware นี้
        "409":
          description: approvalStatus ของ Firmware ปัจจุบันไม่ใช่ pending_review จึงอนุมัติไม่ได้

  /firmware/{firmwareId}/reject:
    post:
      tags: [firmware]
      operationId: rejectFirmware
      summary: QAEngineer ปฏิเสธคุณภาพ Firmware (Firmware Approval Lifecycle — docs/13 §3.2)
      description: >-
        resource เดียวกับ `approveFirmware` (`firmware-decision` action
        `Approve`) — สถานะ `pending_review` → `rejected` เท่านั้น · ไม่มี body
        (ยังไม่รับเหตุผล — mirror `rejectConfig`) FirmwareEngineer ต้องอัปโหลด
        เวอร์ชันใหม่แก้ไข ไม่มีการแก้ไฟล์เดิมซ้ำ
      parameters:
        - in: path
          name: firmwareId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: ปฏิเสธสำเร็จ — approvalStatus เป็น rejected (approvedBy ยังเป็น null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ปฏิเสธคุณภาพ Firmware — เฉพาะ Role QAEngineer เท่านั้น
        "404":
          description: ไม่พบ Firmware นี้
        "409":
          description: approvalStatus ของ Firmware ปัจจุบันไม่ใช่ pending_review จึงปฏิเสธไม่ได้

  /devices:
    get:
      tags: [device]
      operationId: listDevices
      summary: ค้นหา/รายการอุปกรณ์ (Device Search — v3.17)
      description: >-
        ทุก Role ที่ login แล้วเรียกได้ (RBAC_Matrix.md §2 แถว "Device Search /
        Device Detail" = R ทุก Role) · filter ทุกตัว optional — ไม่ส่งอะไรมา =
        คืนทุกเครื่อง · `search` match ทั้ง `deviceId` และ `simNumber`
        (contains, case-insensitive) · ยังไม่มี paging (จำนวน Device ใน MVP น้อย)
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
            maxLength: 100
          description: คำค้น — match deviceId หรือ simNumber แบบ contains
        - in: query
          name: deviceModel
          required: false
          schema:
            type: string
            maxLength: 50
        - in: query
          name: protocol
          required: false
          schema:
            type: string
            maxLength: 50
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [registered, installed, decommissioned]
        - in: query
          name: customerId
          required: false
          schema:
            type: string
            format: uuid
          description: >-
            กรองเฉพาะอุปกรณ์ของลูกค้ารายนี้ (v3.28, issue #204) — เครื่องที่
            `customerId` เป็น `null` (ยังไม่ผูกบริษัท) จะไม่ถูกคืนเมื่อส่ง
            filter นี้มา
      responses:
        "200":
          description: รายการ Device (เรียงตาม deviceId)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "400":
          description: >-
            ค่า status ไม่อยู่ใน enum, query param ยาวเกินกำหนด, หรือ
            customerId ไม่ใช่ uuid
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ

  /devices/{deviceId}:
    get:
      tags: [device]
      operationId: getDevice
      summary: ดูรายละเอียดอุปกรณ์ 1 เครื่อง (Device Detail — v3.17)
      description: >-
        อ้างด้วย `Device.deviceId` (เลขเครื่องจริง) ไม่ใช่ `Device.id` (UUID
        ภายใน) · คืนเฉพาะ field ของ record Device เอง — สถานะ Config/Firmware
        ของกล่อง (`GET /devices/{deviceId}/status`) ยังไม่ implement
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ข้อมูล Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ Device (deviceId) นี้

  /devices/{deviceId}/status:
    get:
      tags: [device-status]
      operationId: getDeviceStatus
      summary: >
        ดูสถานะกล่อง (Config + Firmware) — ครอบคลุมทั้งสถานะ Config
        และสถานะอัปเดตเวอร์ชัน Firmware ของตัวกล่อง (v3.7)
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: สถานะล่าสุด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ Device นี้

  /devices/{deviceId}/test-connection:
    post:
      tags: [device]
      operationId: testDeviceConnection
      summary: ทดสอบการเชื่อมต่อ/สัญญาณของอุปกรณ์ที่ติดตั้งจริง (v3.11)
      description: >-
        สำหรับช่างหน้างาน (ST/OT ผ่าน Mobile) ทดสอบสัญญาณอุปกรณ์เครื่องที่
        ติดตั้งจริงแล้ว — ต่างจาก `simulateConfig` ที่เป็น dry-run ตรวจค่า field
        ของ Config template (สถานะ `draft`/`testing`). อ้างด้วยเลขเครื่องจริง
        (`Device.deviceId`) ไม่มี request body — server ดึงข้อมูล Device จาก DB เอง
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ผลทดสอบการเชื่อมต่อ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConnectionTestResult"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ทดสอบการเชื่อมต่ออุปกรณ์ — เฉพาะ Role ST, OT
        "404":
          description: ไม่พบ Device (deviceId) นี้
        "409":
          description: Device ยังไม่ถึงสถานะ installed (ยังเป็น registered หรือ decommissioned ไปแล้ว) จึงทดสอบสัญญาณไม่ได้

  /devices/{deviceId}/apply-config:
    post:
      tags: [device]
      operationId: applyConfigToDevice
      summary: ใส่ Config ที่อนุมัติแล้วให้อุปกรณ์ที่ติดตั้งจริง (v3.13)
      description: >-
        สำหรับช่างหน้างาน (ST/OT ผ่าน Mobile) — เลือก Config ที่ผูกกับ Task
        ที่กำลังทำ แล้วส่งให้อุปกรณ์เครื่องนั้น. **ไม่ persist / ไม่แตะสถานะใดๆ**
        (fire-and-forget) — กล่องจะรับค่าเมื่อเปิดเครื่องครั้งถัดไป
        (../planning/01_GPS_Build_Reference.md §4.2) จึงไม่มีสถานะอุปกรณ์หลัง apply ใน response.
        โหมด mock ตรวจค่าเบื้องต้น (field ≥ 1, Timeout/Interval ไม่ติดลบ)
        แล้วคืน `applied: true`
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigApplyInput"
      responses:
        "200":
          description: "ผลการ apply (applied=false = ค่าใน Config ไม่ผ่านการตรวจเบื้องต้น)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigApplyResult"
        "400":
          description: configId ไม่ใช่ uuid ที่ถูกต้อง
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ใส่ Config ให้อุปกรณ์ — เฉพาะ Role ST, OT
        "404":
          description: ไม่พบ Device (deviceId) นี้ หรือไม่พบ Config (configId) นี้
        "409":
          description: >-
            ใส่ Config ไม่ได้ — Device ยังไม่ installed / Config ยังไม่ผ่านอนุมัติ
            (ต้อง approved หรือ synced) / Config คนละ deviceModel/protocol กับ Device

  /devices/{deviceId}/confirm-firmware-install:
    post:
      tags: [device]
      operationId: confirmFirmwareInstall
      summary: ช่างยืนยันว่าติดตั้ง Firmware เข้าอุปกรณ์เสร็จแล้วจริง (v3.29, issue #181)
      description: >-
        สำหรับช่างหน้างาน (ST/OT ผ่าน Mobile) — **ไม่ใช่คำสั่งส่งอะไรไปอุปกรณ์เลย**
        ต่างจาก `applyConfigToDevice` ที่ยังมี mock fire-and-forget อยู่เบื้องหลัง
        endpoint นี้เป็นแค่การบันทึกว่า "มีการยืนยันเกิดขึ้น" (AuditLog เท่านั้น)
        **ไม่คำนวณ `Firmware.deviceUpdateStatus` จริง** (ยังคงเป็น unknown ต่อไป)
        — placeholder ระดับที่ทำได้ในขอบเขตฝึกงาน ต่างจาก Workflow Firmware
        แบบ state machine อัตโนมัติเต็มรูปแบบใน design doc §10.2-10.3 ที่ทำไม่ได้
        เพราะระบบเป็น PULL model (backend ไม่คุยกับอุปกรณ์ตรงๆ)
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmFirmwareInstallInput"
      responses:
        "200":
          description: ยืนยันสำเร็จ — บันทึก AuditLog แล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmFirmwareInstallResult"
        "400":
          description: firmwareId ไม่ใช่ uuid ที่ถูกต้อง
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ยืนยันติดตั้ง Firmware — เฉพาะ Role ST, OT
        "404":
          description: ไม่พบ Device (deviceId) นี้ หรือไม่พบ Firmware (firmwareId) นี้
        "409":
          description: >-
            ยืนยันไม่ได้ — Device ยังไม่ installed / Firmware ยังไม่ผ่านอัปโหลด
            (ต้อง stored) / Firmware ยังไม่ผ่านอนุมัติคุณภาพ (ต้อง approved) /
            Firmware ไม่รองรับรุ่นอุปกรณ์เครื่องนี้

  /devices/{deviceId}/simulate-config:
    post:
      tags: [device]
      operationId: simulateConfigOnDevice
      summary: เช็คว่า Config พร้อมอัพโหลดเข้าอุปกรณ์เครื่องนี้จริงไหม (v3.15)
      description: >-
        สำหรับช่างหน้างาน (ST/OT ผ่าน Mobile) — dry-run ก่อน `applyConfigToDevice`
        จริง รวม 3 ส่วนเป็นผลเดียว: (1) Config เองพร้อมไหม (reuse ตัวเดียวกับ
        `simulateConfig`) (2) deviceModel/protocol ของ Config ตรงกับอุปกรณ์เครื่อง
        นี้ไหม (3) สัญญาณอุปกรณ์จริง (reuse ตัวเดียวกับ `testDeviceConnection`).
        **ไม่ persist / ไม่แตะสถานะใดๆ** ทั้ง Device และ Config. อ้างด้วยเลขเครื่อง
        จริง (`Device.deviceId`). ต่างจาก `applyConfigToDevice`: deviceModel/protocol
        ไม่ตรง **ไม่ใช่ 409** — คืน 200 พร้อม `compatibilityCheck.passed:false`
        เพื่อให้ช่างเห็นว่าอะไรไม่ตรง
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateConfigOnDeviceInput"
      responses:
        "200":
          description: >-
            ผลเช็คความพร้อม (3 ส่วนรวมใน response เดียว) — `passed:false` = ส่วนใด
            ส่วนหนึ่งไม่ผ่าน (รวมถึง deviceModel/protocol ไม่ตรง)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSimulateConfigResult"
        "400":
          description: configId ไม่ใช่ uuid ที่ถูกต้อง
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์เช็คความพร้อมของอุปกรณ์ — เฉพาะ Role ST, OT
        "404":
          description: ไม่พบ Device (deviceId) นี้ หรือไม่พบ Config (configId) นี้
        "409":
          description: >-
            เช็คความพร้อมไม่ได้ — Device ยังไม่ installed หรือ Config ยังไม่ผ่าน
            อนุมัติ (ต้อง approved หรือ synced)

  /incidents:
    get:
      tags: [incident]
      operationId: listIncidents
      summary: รายการ Incident (read-only) — v3.18
      description: >-
        ทุก Role ที่ login แล้วเรียกได้ (RBAC_Matrix.md §2 แถว "Incident &
        Rollback" = R ทุก Role) · filter ทุกตัว optional — ไม่ส่งอะไรมา = คืน
        ทุกรายการ เรียงตาม createdAt desc (ใหม่สุดก่อน)
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [open, investigating, rolled_back, resolved]
        - in: query
          name: relatedConfigId
          required: false
          schema:
            type: string
            maxLength: 100
        - in: query
          name: relatedFirmwareId
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: รายการ Incident (เรียงตาม createdAt desc)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
        "400":
          description: ค่า status ไม่อยู่ใน enum หรือ query param ยาวเกินกำหนด
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ

  /incidents/{id}:
    get:
      tags: [incident]
      operationId: getIncident
      summary: ดูรายละเอียด Incident 1 รายการ — v3.18
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: ข้อมูล Incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ Incident นี้

  /audit-logs:
    get:
      tags: [audit]
      operationId: listAuditLogs
      summary: ประวัติการทำงานแบบ mutation-only (list + filter) — v3.19
      description: >-
        ทุก Role ยกเว้น **ConfigEngineer/FirmwareEngineer/QAEngineer**
        (RBAC_Matrix.md §2 แถว "Audit Log" — เดิม SW ตัวเดียวก่อนแยก role
        เป็น "-" ทั้งแถว) resource `audit-logs` action Read · filter ทุกตัว optional —
        ไม่ส่งอะไรมา = คืนทุกรายการ เรียงตาม createdAt desc (ใหม่สุดก่อน) · ไม่
        join ชื่อผู้ใช้มาให้ (คืนแค่ userId ดิบ) — client resolve ชื่อเอง
      parameters:
        - in: query
          name: userId
          required: false
          schema:
            type: string
            maxLength: 100
        - in: query
          name: auditModule
          required: false
          schema:
            type: string
            maxLength: 100
          description: ชื่อโมดูลที่เกิด mutation (เช่น config, config-deletion, device, task)
        - in: query
          name: action
          required: false
          schema:
            type: string
            maxLength: 100
          description: >-
            ค้นหาแบบ contains ไม่สนตัวพิมพ์เล็ก-ใหญ่ (ต่างจาก userId/auditModule
            ที่ match ตรงเป๊ะ) เช่น create, update, delete, decide, approve,
            reject, apply-config
      responses:
        "200":
          description: รายการ AuditLog (เรียงตาม createdAt desc)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: Role ไม่มีสิทธิ์ audit-logs.Read (เช่น ConfigEngineer)

  /users:
    get:
      tags: [user]
      operationId: listUsers
      summary: รายชื่อ user แบบย่อ (id + ชื่อ + role) — v3.19
      description: >-
        ทุก Role ที่ login แล้วเรียกได้ (JwtAuthGuard อย่างเดียว ไม่มี
        PermissionGuard — pattern เดียวกับ /notifications/device-tokens) ·
        คืนแค่ id/ชื่อ/role ไม่มีข้อมูล sensitive · ใช้ทำ dropdown "เจาะจง
        ผู้อนุมัติ" ใน Approval Center · **ไม่ใช่** จอ User / Role Management
        (Admin เท่านั้น — ดู `listManagedUsers`/`createUser`/`updateUser`
        ด้านล่าง)
      parameters:
        - in: query
          name: role
          required: false
          schema:
            type: string
            maxLength: 50
          description: filter ตาม role code (เช่น Operation) — ไม่ส่ง = ทุก user ที่ active
      responses:
        "200":
          description: รายชื่อ user (เฉพาะ active · เรียงตามชื่อ)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
    post:
      tags: [user]
      operationId: createUser
      summary: สร้างบัญชีทั่วไปใหม่ (User / Role Management — Admin เท่านั้น)
      description: >-
        resource `user-management` action `Create` — Admin เท่านั้น (RBAC_Matrix.md
        §2 "บัญชีทั่วไป — ไม่รวม Admin/SuperAdmin") จัดการได้แค่บัญชีที่ `role`
        ไม่ใช่ `Admin`/`SuperAdmin` — สร้างบัญชีเป็น 2 role นี้เป็นสิทธิ์แยก
        (`admin-management`) ที่ยังไม่ finalize (docs/11) · Admin เป็นคนตั้ง
        รหัสผ่านเริ่มต้นเอง (ระบบยังไม่มี flow ลืมรหัสผ่าน/reset password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          description: >-
            validation ไม่ผ่าน (username ผิดรูปแบบ, password สั้นกว่า 8 ตัว),
            ไม่พบ role code ที่ระบุ, หรือ role เป็น Admin/SuperAdmin (สร้างผ่าน
            หน้านี้ไม่ได้)
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์สร้างบัญชี — เฉพาะ Role Admin (และ SuperAdmin) เท่านั้น
        "409":
          description: username ถูกใช้แล้ว

  /users/managed:
    get:
      tags: [user]
      operationId: listManagedUsers
      summary: รายชื่อบัญชีทั่วไปแบบเต็ม (User / Role Management — Admin เท่านั้น)
      description: >-
        resource `user-management` action `Read` — Admin เท่านั้น คืน
        username/isActive ด้วย (ต่างจาก `listUsers` ที่คืนแค่ id/ชื่อ/role
        และเฉพาะ user active) ตัดบัญชี Admin/SuperAdmin ออกทั้งหมดเสมอ
      responses:
        "200":
          description: รายชื่อบัญชีทั่วไป (รวม active และ inactive · เรียงตามชื่อ)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedUser"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ดูรายชื่อนี้ — เฉพาะ Role Admin (และ SuperAdmin) เท่านั้น

  /users/{userId}:
    patch:
      tags: [user]
      operationId: updateUser
      summary: แก้ role และ/หรือเปิด-ปิดการใช้งานบัญชี (User / Role Management — Admin เท่านั้น)
      description: >-
        resource `user-management` action `Update` — Admin เท่านั้น · ไม่มี
        hard delete ใช้ `isActive: false` แทน · บัญชีเป้าหมายต้องไม่ใช่
        Admin/SuperAdmin (มองว่า "ไม่มีอยู่" จาก resource นี้ — 404) และแก้
        `role` ไปเป็น Admin/SuperAdmin ก็ไม่ได้เช่นกัน (กัน privilege escalation)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          description: ไม่พบ role code ที่ระบุ หรือพยายามแก้ role เป็น Admin/SuperAdmin
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์แก้บัญชีนี้ — เฉพาะ Role Admin (และ SuperAdmin) เท่านั้น
        "404":
          description: ไม่พบผู้ใช้ id นี้ (รวมถึงกรณีที่ user มีอยู่จริงแต่ role เป็น Admin/SuperAdmin)

  /device-models:
