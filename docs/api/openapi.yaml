        "400":
          description: validation ไม่ผ่าน (เช่น supportedProtocols ว่างเปล่า)
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์สร้างรุ่นอุปกรณ์ — เฉพาะ Role Admin (และ SuperAdmin) เท่านั้น
        "409":
