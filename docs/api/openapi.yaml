      description: >-
        resource `device-model` action `Update` — Admin/SuperAdmin เท่านั้น
        · ไม่มี hard delete ใช้ `status: discontinued` แทน · ไม่มี `name` ให้
        แก้ (ต้องตรงกับ string เดิมที่กระจายอยู่ทั่วระบบเป๊ะ — เปลี่ยนชื่อ
        รุ่นทีหลังเสี่ยงทำให้ Device/Config ที่อ้างชื่อเดิมหาไม่เจอ)
      parameters:
        - in: path
          name: deviceModelId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceModelInput"
      responses:
        "200":
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceModel"
        "400":
          description: validation ไม่ผ่าน (เช่น supportedProtocols ว่างเปล่า)
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์แก้รุ่นอุปกรณ์นี้ — เฉพาะ Role Admin (และ SuperAdmin) เท่านั้น
        "404":
          description: ไม่พบรุ่นอุปกรณ์ id นี้

  /customers:
    get:
      tags: [customer]
      operationId: listCustomers
      summary: รายชื่อลูกค้าแบบย่อ (id + ชื่อบริษัท) — v3.22
      description: >-
        ทุก Role ที่ login แล้วเรียกได้ (JwtAuthGuard อย่างเดียว ไม่มี
        PermissionGuard — pattern เดียวกับ /users) · เรียงตามชื่อบริษัท
        · ใช้ทำ dropdown filter "ลูกค้า" บนหน้า Device Search
        (docs/12_CustomerScope_Proposal.md เฟส B, PR #127/#153) · **ไม่ใช่**
        จอ "จัดการลูกค้า" (Admin CRUD) — ตัดสินใจร่วมกันแล้วว่าเกินขอบเขต
        ตอนนี้ ลูกค้าเพิ่ม/แก้ได้ผ่าน seed เท่านั้น
      responses:
        "200":
          description: รายชื่อลูกค้าทั้งหมด (เรียงตามชื่อบริษัท)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerSummary"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ

  /campaigns:
    get:
      tags: [campaign]
      operationId: listCampaigns
      summary: รายการกลุ่มอุปกรณ์ทั้งหมด — v3.30
      description: >-
        ทุก Role อ่านได้ (resource `campaign` action `Read`) เรียงตาม
        createdAt desc · **แก้ไข 2026-09-24:** ตัด query param `status` ออก
        — `Campaign` (กลุ่ม) ไม่มีสถานะอีกต่อไป (ย้ายไปอยู่ที่
        `CampaignRollout.status` แทน ดู tag `campaign` description)
      responses:
        "200":
          description: รายการกลุ่มอุปกรณ์ (เรียงตาม createdAt desc)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
    post:
      tags: [campaign]
      operationId: createCampaign
      summary: สร้างกลุ่มอุปกรณ์ใหม่ (Campaign Wizard, #21) — v3.30
      description: >-
        **Operation เท่านั้น** (resource `campaign` action `Create`) — สร้าง
        Campaign (กลุ่ม) + CampaignTarget (สมาชิก) ใน transaction เดียว ·
        **ไม่มี payload/approval ในคำขอนี้แล้ว** (แก้ไข 2026-09-24 —
        payloadType/configId/firmwareId ย้ายไปอยู่ที่ `createCampaignRollout`
        แทน เพราะกลุ่มหนึ่ง push payload ได้หลายรอบตลอดอายุการใช้งาน) **ไม่สร้าง
        Task/มอบหมายงานให้ช่างหน้างาน** (แก้ไข 2026-09-14 — การมอบหมายงานเป็น
        หน้าที่ของระบบแยกที่บริษัทมีอยู่แล้ว) · **MVP:** สมาชิกกลุ่ม fix ตอน
        สร้างเท่านั้น ยังไม่มี endpoint เพิ่ม/ลบทีหลัง
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCreateRequest"
      responses:
        "201":
          description: สร้างกลุ่มสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          description: validation ไม่ผ่าน (targets ว่างเปล่า, deviceId ซ้ำกัน)
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: Role ไม่มีสิทธิ์ campaign.Create (ไม่ใช่ Operation)
        "409":
          description: >-
            อุปกรณ์เป้าหมายบางเครื่องไม่พบ หรือยังไม่ installed (รวมทุกปัญหา
            ไว้ในข้อความเดียว)

  /campaigns/{id}:
    get:
      tags: [campaign]
      operationId: getCampaign
      summary: รายละเอียดกลุ่มอุปกรณ์ 1 กลุ่ม — v3.30
      description: ทุก Role อ่านได้ (resource `campaign` action `Read` เดียวกับ listCampaigns)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: ข้อมูลกลุ่ม
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบกลุ่มนี้

  /campaigns/{id}/targets:
    get:
      tags: [campaign]
      operationId: listCampaignTargets
      summary: รายชื่อสมาชิกกลุ่ม — v3.30 (Campaign Monitor #22)
      description: ทุก Role อ่านได้ (resource `campaign` action `Read` เดียวกับ getCampaign)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: รายชื่อสมาชิกกลุ่ม (เรียงตาม createdAt asc)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignTarget"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ

  /campaigns/{id}/rollouts:
    get:
      tags: [campaign]
      operationId: listCampaignRollouts
      summary: ประวัติ Rollout ทั้งหมดของกลุ่มนี้ — v3.30 (Campaign Monitor #22)
      description: ทุก Role อ่านได้ (resource `campaign` action `Read`) เรียงตาม createdAt desc
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: รายการ Rollout ของกลุ่มนี้
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignRollout"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
    post:
      tags: [campaign]
      operationId: createCampaignRollout
      summary: เริ่ม Rollout ใหม่ — push Config/Firmware เข้ากลุ่ม — v3.30 (Campaign Monitor #22)
      description: >-
        **Operation เท่านั้น** (resource `campaign` action `Create`) — เลือก
        Config หรือ Firmware มา push เข้าสมาชิกกลุ่ม (default = ทั้งกลุ่ม
        เอาบางเครื่องออกได้ผ่าน `excludeDeviceIds`) สร้างแล้วเป็น
        `pending_approval` เสมอ ต้องรอ Operation อีกคนอนุมัติก่อนถึงจะ
        `active` (Campaign Approval, แก้ครั้งที่ 39) **กลุ่มหนึ่งรัน Rollout
        ได้ทีละรอบเท่านั้น** — 409 ถ้ายังมีรอบที่ `pending_approval`/`active`
        ค้างอยู่ · เกณฑ์ payload เดียวกับที่เคยอยู่ใน `createCampaign` เดิม
        ทุกประการ (Config ต้อง `approved`/`synced` + deviceModel/protocol
        ตรงกับอุปกรณ์ทุกเครื่อง, Firmware ต้อง `uploadStatus: stored` +
        `approvalStatus: approved` + `deviceModel` อยู่ใน
        `deviceModelCompatibility`)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignRolloutCreateRequest"
      responses:
        "201":
          description: สร้าง Rollout สำเร็จ (status = pending_approval — รออนุมัติ)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignRollout"
        "400":
          description: >-
            validation ไม่ผ่าน (ไม่ระบุ configId/firmwareId ให้ตรงกับ
            payloadType, excludeDeviceIds มีเครื่องที่ไม่ได้อยู่ในกลุ่ม, หรือ
            เอาเครื่องออกจนไม่เหลือเป้าหมายเลย)
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: Role ไม่มีสิทธิ์ campaign.Create (ไม่ใช่ Operation)
        "404":
          description: ไม่พบกลุ่มนี้ หรือไม่พบ Config/Firmware ตาม id ที่ระบุ
        "409":
          description: >-
            กลุ่มนี้มี Rollout ที่ยังไม่จบค้างอยู่ หรือ Config/Firmware ยังไม่
            ผ่านเกณฑ์ หรืออุปกรณ์เป้าหมายบางเครื่องยังไม่ installed หรือ
            รุ่น/โปรโตคอลไม่ตรงกับ payload (รวมทุกปัญหาไว้ในข้อความเดียว)

  /campaigns/{id}/rollouts/{rolloutId}:
    get:
      tags: [campaign]
      operationId: getCampaignRollout
      summary: รายละเอียด Rollout 1 รอบ — v3.30 (Campaign Monitor #22)
      description: ทุก Role อ่านได้ (resource `campaign` action `Read`)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: rolloutId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: ข้อมูล Rollout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignRollout"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ Rollout นี้

  /campaigns/{id}/rollouts/{rolloutId}/targets:
    get:
      tags: [campaign]
      operationId: listCampaignRolloutTargets
      summary: ผลของ Rollout ต่อเครื่อง — Failure Rate จริง — v3.30 (Campaign Monitor #22)
      description: >-
        ทุก Role อ่านได้ (resource `campaign` action `Read`) — อัปเดตจาก
        `applyConfigToDevice`/`confirmFirmwareInstall` จริง (mock mode ก็
        รายงานผลได้ ดู `MockConfigApplier`)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: rolloutId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: รายการผลต่อเครื่อง (เรียงตาม createdAt asc)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignRolloutTarget"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ

  /campaigns/{id}/rollouts/{rolloutId}/approve:
    post:
      tags: [campaign]
      operationId: approveCampaignRollout
      summary: Operation อนุมัติ Rollout (Campaign Approval) — v3.30
      description: >-
        resource `campaign` action `Approve` (Operation เท่านั้น) — สถานะ
        `pending_approval` → `active` เท่านั้น พร้อมบันทึก `approvedBy`/
        `approvedAt` · **Separation of Duty:** ผู้กดอนุมัติต้องไม่ใช่ผู้สร้าง
        Rollout เดียวกัน (403)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: rolloutId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: อนุมัติสำเร็จ — status เป็น active พร้อม approvedBy/approvedAt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignRollout"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: >-
            ไม่มีสิทธิ์อนุมัติ Rollout (ไม่ใช่ Operation) หรือเป็นผู้สร้าง
            Rollout นี้เอง (Separation of Duty)
        "404":
          description: ไม่พบ Rollout นี้
        "409":
          description: สถานะ Rollout ปัจจุบันไม่ใช่ pending_approval จึงอนุมัติไม่ได้

  /campaigns/{id}/rollouts/{rolloutId}/reject:
    post:
      tags: [campaign]
      operationId: rejectCampaignRollout
      summary: Operation ปฏิเสธ Rollout (Campaign Approval) — v3.30
      description: >-
        resource เดียวกับ `approveCampaignRollout` (`campaign` action
        `Approve`) — สถานะ `pending_approval` → `rejected` เท่านั้น · ไม่ตั้ง
        `approvedBy`/`approvedAt` (คงเป็น null) เช็ค Separation of Duty
        เดียวกับ approve · Rollout ที่ rejected ค้างไว้เป็นประวัติ — เปิดรอบ
        ใหม่ในกลุ่มเดิมได้ทันทีผ่าน `createCampaignRollout` (ไม่นับเป็น
        "ค้างอยู่")
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: rolloutId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: ปฏิเสธสำเร็จ — status เป็น rejected (approvedBy ยังเป็น null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignRollout"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: >-
            ไม่มีสิทธิ์ปฏิเสธ Rollout (ไม่ใช่ Operation) หรือเป็นผู้สร้าง
            Rollout นี้เอง (Separation of Duty)
        "404":
          description: ไม่พบ Rollout นี้
        "409":
          description: สถานะ Rollout ปัจจุบันไม่ใช่ pending_approval จึงปฏิเสธไม่ได้

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        role:
          type: string
          # เดิม enum ตายตัว [SW, Operation, ST, OT, Auditor, Admin] — เปลี่ยนเป็น
          # free-form string แล้ว เพราะ Role เปลี่ยนจาก Postgres enum เป็นตารางจริง
          # (feature/rbac-role-table, 2026-08-28) Admin สร้าง Role ใหม่ผ่านหน้า
          # User/Role Management ได้เอง ค่า role ที่ส่งกลับมาจึงไม่ใช่ค่าคงที่ 6 ตัวอีกต่อไป
          description: >-
            Role code ของผู้ใช้ (เช่น ConfigEngineer, FirmwareEngineer,
            QAEngineer, Operation, ST, OT, Auditor, Admin, SuperAdmin — เดิมมี
            SW ตัวเดียวก่อนแยกเป็น 3 role ตาม docs/13_Role_Redesign_Proposal.md
            — หรือ role อื่นที่ Admin สร้างเพิ่มภายหลัง)
          example: ConfigEngineer

    AuditLogEntry:
      type: object
      description: >-
        แถวประวัติการทำงาน 1 รายการ (listAuditLogs — v3.19) — mutation-only
        ตาม CLAUDE.md Audit Pattern ไม่มี resourceId (ไม่ผูกกับ record ที่ถูก
        แก้โดยตรง เก็บแค่ผู้ทำ/โมดูล/action) · ipAddress ยังไม่มี endpoint ไหน
        ส่งมาจริงตอนนี้ (nullable ไว้รอ) · metadata เพิ่ม v3.27 (issue #205)
      required: [id, userId, auditModule, action, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        auditModule:
          type: string
          description: ชื่อโมดูลที่เกิด mutation (เช่น config, config-deletion, device, task)
        action:
          type: string
          description: เช่น create, update, delete, decide, approve, reject, apply-config
        ipAddress:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            รายละเอียดเชิงโครงสร้างเพิ่มเติม (issue #205) — มีเฉพาะบาง action ที่
            ถือว่าสำคัญ/จำเป็นต่อการตรวจสอบเท่านั้น (ตอนนี้มีแค่ `apply-config`:
            `{ deviceId, configId, fieldNames }` — `fieldNames` เป็นชื่อ field
            ไม่ใช่ค่าจริง กันข้อมูลอ่อนไหวรั่ว) แถวเก่าก่อนหน้านี้เป็น `null`
        createdAt:
          type: string
          format: date-time

    UserSummary:
      type: object
      description: >-
        ข้อมูล user แบบย่อ (listUsers — v3.19) · id + ชื่อ + role code เท่านั้น
        ไม่มี username / email / สิทธิ์
      required: [id, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        role:
          type: string
          description: Role code (เช่น Operation)

    ManagedUser:
      type: object
      description: >-
        ข้อมูล user เต็มสำหรับหน้า User / Role Management (listManagedUsers/
        createUser/updateUser) — ไม่มี passwordHash หลุดออกมาเด็ดขาด · role
        เป็นไปได้แค่ role ที่ไม่ใช่ Admin/SuperAdmin เท่านั้น (RBAC_Matrix.md §2)
      required: [id, username, fullName, role, isActive]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
        role:
          type: string
          description: Role code (เช่น Operation) — ไม่มีทางเป็น Admin/SuperAdmin
        isActive:
          type: boolean

    CreateUserInput:
      type: object
      required: [username, fullName, password, role]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[a-zA-Z0-9._-]+$"
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 100
          description: Admin เป็นคนตั้งเอง — ระบบยังไม่มี flow ลืมรหัสผ่าน/reset password
        role:
          type: string
          description: Role code ที่ไม่ใช่ Admin/SuperAdmin (400 ถ้าเป็น 2 role นี้)

    UpdateUserInput:
      type: object
      description: ทั้ง 2 field optional — ส่งแค่ตัวที่จะแก้ก็พอ
      properties:
        role:
          type: string
          description: Role code ที่ไม่ใช่ Admin/SuperAdmin (400 ถ้าเป็น 2 role นี้)
        isActive:
          type: boolean

    DeviceModelStatus:
      type: string
      enum: [active, discontinued]
      description: >-
        active = ยังผลิต/สั่งซื้อได้ปกติ, discontinued = เลิกผลิตแล้วแต่
        เครื่องที่ใช้งานอยู่ยังทำงานได้ตามปกติ

    DeviceModel:
      type: object
      description: >-
        รุ่นอุปกรณ์ (v3.28, issue #209, docs/15) — canonical registry แทน
        string อิสระเดิมที่กระจายอยู่ใน Device/Config/Firmware/
        ConfigFieldDefinitionModelSupport (ยังไม่ migrate 3 ตัวหลังไปใช้
        modelId ในรอบนี้)
      required:
        [id, name, supportedProtocols, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: GT06N
          description: ต้องตรงกับ string เดิมที่ใช้อยู่แล้วทุกจุดเป๊ะ
        manufacturer:
          type: string
          nullable: true
        supportedProtocols:
          type: array
          items:
            type: string
          description: >-
            โปรโตคอลที่รุ่นนี้รองรับ — enforce จริงตอนสร้าง/แก้ Config
            (Config.protocol ต้องอยู่ในลิสต์นี้ ไม่งั้น 400)
        status:
          $ref: "#/components/schemas/DeviceModelStatus"
        warrantyMonths:
          type: integer
          nullable: true
        endOfSupportDate:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDeviceModelInput:
      type: object
      required: [name, supportedProtocols]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        manufacturer:
          type: string
          maxLength: 100
        supportedProtocols:
          type: array
          minItems: 1
          items:
            type: string
          description: บังคับอย่างน้อย 1 ค่า
        status:
          $ref: "#/components/schemas/DeviceModelStatus"
        warrantyMonths:
          type: integer
          minimum: 0
        endOfSupportDate:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 1000

    UpdateDeviceModelInput:
      type: object
      description: ทุก field optional — ส่งแค่ตัวที่จะแก้ก็พอ (ไม่มี `name` ให้แก้)
      properties:
        manufacturer:
          type: string
          maxLength: 100
        supportedProtocols:
          type: array
          minItems: 1
          items:
            type: string
        status:
          $ref: "#/components/schemas/DeviceModelStatus"
        warrantyMonths:
          type: integer
          minimum: 0
        endOfSupportDate:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 1000

    CampaignPayloadType:
      type: string
      enum: [Config, Firmware]
      description: >-
        เลือกได้ทั้งสองแบบ (แก้ไข 2026-09-14 — `Firmware` เปิดใช้งานแล้วหลัง
        Sprint 3 #23/PR #151) — `createCampaignRollout` ต้องระบุ `configId`
        คู่กับ `Config` หรือ `firmwareId` คู่กับ `Firmware` ให้ตรงกัน

    Campaign:
      type: object
      description: >-
        1 กลุ่มอุปกรณ์ (listCampaigns/getCampaign/createCampaign — v3.30) ตรง
        กับ Prisma model `Campaign` — ไม่ embed สมาชิกกลุ่ม (ดู
        `listCampaignTargets`) หรือประวัติ Rollout (ดู `listCampaignRollouts`)
        **แก้ไข 2026-09-24 (Campaign Monitor #22):** เดิม schema นี้มี
        payloadType/configId/firmwareId/status/targetCount/successCount/
        failureCount/approvedBy/approvedAt ติดตัว — ย้ายทั้งหมดไปอยู่ที่
        `CampaignRollout` แทน เพราะกลุ่มหนึ่ง push payload ได้หลายรอบ ไม่ผูก
        กับ payload ตัวเดียวอีกต่อไป (ดู tag `campaign` description)
      required: [id, name, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CampaignTargetInput:
      type: object
      description: >-
        อุปกรณ์สมาชิก 1 เครื่อง (createCampaign) — ไม่มี field มอบหมาย
        ผู้รับผิดชอบหน้างานแล้ว (แก้ไข 2026-09-14: Campaign ใช้สำหรับ
        ติดตาม/บำรุงรักษาอุปกรณ์เป็นกลุ่มเท่านั้น การมอบหมายงานเป็นหน้าที่
        ของระบบแยกที่บริษัทมีอยู่แล้ว)
      required: [deviceId]
      properties:
        deviceId:
          type: string
          description: >-
            `Device.deviceId` (เลขเครื่องจริง) ไม่ใช่ `Device.id` UUID ภายใน
            — ต้องเป็นอุปกรณ์สถานะ `installed` ไม่งั้น 409 (เช็ค compatibility
            กับ payload ตอนสร้าง Rollout แทน เพราะตอนสร้างกลุ่มยังไม่รู้ว่า
            จะ push อะไร — แก้ไข 2026-09-24)

    CampaignCreateRequest:
      type: object
      required: [name, targets]
      description: >-
        **แก้ไข 2026-09-24:** ตัด payloadType/configId/firmwareId ออก — สร้าง
        กลุ่มเปล่าๆ เท่านั้น เลือก payload ทีหลังผ่าน `createCampaignRollout`
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        targets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CampaignTargetInput"

    CampaignTarget:
      type: object
      description: >-
        สมาชิกกลุ่ม 1 เครื่อง (listCampaignTargets — v3.30, Campaign Monitor
        #22) ตรงกับ Prisma model `CampaignTarget` — ไม่มี status (สมาชิกกลุ่ม
        ไม่ผูกกับผล push รอบไหนรอบหนึ่ง ดู `CampaignRolloutTarget` แทน)
      required: [id, campaignId, deviceId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        deviceId:
          type: string
        createdAt:
          type: string
          format: date-time

    CampaignRolloutStatus:
      type: string
      enum: [pending_approval, active, rejected, completed, cancelled]
      description: >-
        Campaign Approval (แก้ครั้งที่ 39, ย้ายมาจาก `CampaignStatus` เดิม —
        แก้ไข 2026-09-24): `createCampaignRollout` สร้างแล้วเป็น
        `pending_approval` เสมอ (ไม่มี `draft` อีกต่อไป) ต้องผ่าน
        `approveCampaignRollout` (→ `active`) หรือ `rejectCampaignRollout`
        (→ `rejected`) โดย Operation คนอื่นที่ไม่ใช่ผู้สร้าง (Separation of
        Duty) · `active` เปลี่ยนเป็น `completed` อัตโนมัติเมื่อทุกเครื่องใน
        รอบมีผล success/failed ครบแล้ว (ดู `CampaignRolloutTarget`) ·
        `rejected`/`completed`/`cancelled` ไม่นับเป็น "รอบที่ยังไม่จบ" —
        เปิดรอบใหม่ในกลุ่มเดิมได้ทันที (กลุ่มหนึ่งรัน Rollout ได้ทีละรอบ
        เท่านั้น ขณะที่ยัง `pending_approval`/`active`)

    CampaignRollout:
      type: object
      description: >-
        1 รอบ push Config หรือ Firmware เข้ากลุ่มอุปกรณ์หนึ่งกลุ่ม
        (listCampaignRollouts/getCampaignRollout/createCampaignRollout —
        v3.30, Campaign Monitor #22) ตรงกับ Prisma model `CampaignRollout` —
        รับ field ที่เคยอยู่บน `Campaign` เดิมมาทั้งหมด (ดู tag `campaign`
        description)
      required:
        [
          id,
          campaignId,
          payloadType,
          status,
          targetCount,
          successCount,
          failureCount,
          createdBy,
          approvedBy,
          approvedAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        payloadType:
          $ref: "#/components/schemas/CampaignPayloadType"
        configId:
          type: string
          format: uuid
          nullable: true
        firmwareId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: "#/components/schemas/CampaignRolloutStatus"
        targetCount:
          type: integer
        successCount:
          type: integer
          description: >-
            นับจากจำนวน `CampaignRolloutTarget.status = success` จริง —
            อัปเดตทุกครั้งที่ `applyConfigToDevice`/`confirmFirmwareInstall`
            รายงานผลเข้ามา (Campaign Monitor #22, แก้ไข 2026-09-24 — เดิมเป็น
            0 เสมอไม่มี logic อัปเดต)
        failureCount:
          type: integer
          description: เหตุผลเดียวกับ successCount ด้านบน (นับจาก status = failed)
        createdBy:
          type: string
          format: uuid
        approvedBy:
          type: string
          format: uuid
          nullable: true
          description: >-
            user id ของ Operation ที่กด `approveCampaignRollout` (ต้องไม่ใช่
            createdBy คนเดียวกัน) เป็น null จนกว่าจะอนุมัติ ·
            `rejectCampaignRollout` ไม่ตั้งค่านี้ (คงเป็น null)
        approvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CampaignRolloutCreateRequest:
      type: object
      required: [payloadType]
      description: >-
        Body ของ `createCampaignRollout` (v3.30, Campaign Monitor #22) — ไม่มี
        field เลือก target เอง default = สมาชิกทั้งกลุ่ม เอาบางเครื่องออกได้
        ผ่าน `excludeDeviceIds` เท่านั้น (ไม่รองรับเพิ่มเครื่องนอกกลุ่ม)
      properties:
        payloadType:
          $ref: "#/components/schemas/CampaignPayloadType"
        configId:
          type: string
          format: uuid
          description: บังคับเมื่อ payloadType เป็น Config
        firmwareId:
          type: string
          format: uuid
          description: บังคับเมื่อ payloadType เป็น Firmware
        excludeDeviceIds:
          type: array
          items:
            type: string
          description: >-
            `Device.deviceId` ของสมาชิกกลุ่มที่ต้องการเอาออกจาก Rollout รอบนี้
            (ทุกตัวต้องเป็นสมาชิกกลุ่มจริง ไม่งั้น 400 — เอาออกจนไม่เหลือ
            เป้าหมายเลยก็ 400 เช่นกัน)

    CampaignRolloutTargetStatus:
      type: string
      enum: [pending, success, failed]
      description: >-
        ผลของ Rollout รอบหนึ่งต่ออุปกรณ์หนึ่งเครื่อง (Campaign Monitor #22) —
        เริ่มเป็น `pending` เสมอตอนสร้าง Rollout เปลี่ยนเป็น `success`/`failed`
        เมื่อ `applyConfigToDevice`/`confirmFirmwareInstall` รายงานผลเข้ามา

    CampaignRolloutTarget:
      type: object
      description: >-
        ผลต่อเครื่องของ Rollout 1 รอบ (listCampaignRolloutTargets — v3.30,
        Campaign Monitor #22) ตรงกับ Prisma model `CampaignRolloutTarget`
      required: [id, rolloutId, deviceId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        rolloutId:
          type: string
          format: uuid
        deviceId:
          type: string
        status:
          $ref: "#/components/schemas/CampaignRolloutTargetStatus"
        resultDetail:
          type: string
          nullable: true
          description: รายละเอียดผล (จาก `ConfigApplyResult.details` หรือข้อความยืนยันติดตั้ง Firmware)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DeviceConfigDraft:
      type: object
      description: โครงสร้างกลางที่ทั้งฟอร์มและ Import JSON แปลงเข้ามาเป็นแบบเดียวกัน (response shape — มี id/status ที่ server เป็นคนกำหนด)
      properties:
        id:
          type: string
        name:
          type: string
          description: ชื่อ Config ที่ผู้ใช้ตั้ง — unique ทั้งระบบ (มติ Sprint 1 review ข้อ 4)
          example: GT06N · ตั้งค่ามาตรฐานภาคกลาง
        deviceModel:
          type: string
        protocol:
          type: string
          example: TCP
        status:
          type: string
          enum: [draft, testing, approved, rejected, synced]
        description:
          type: string
          nullable: true
          description: คำอธิบายสั้นๆ ว่า Config ชุดนี้ทำไว้เพื่ออะไร (ไม่บังคับ)
        fields:
          type: object
          additionalProperties: true
          description: ค่า field ตาม Config Definition Lookup (เช่น APN1, MTYP, SIM1)
        createdBy:
          type: string
          description: user id ของ ConfigEngineer ที่สร้าง Config นี้ (server กำหนดจาก JWT)
        approvedBy:
          type: string
          nullable: true
          description: >-
            user id ของ Operation ที่กดอนุมัติ (null = ยังไม่อนุมัติ) — ตั้งค่าโดย
            approveConfig เพื่อเป็นร่องรอย Separation of Duty
        suggestedApproverId:
          type: string
          format: uuid
          nullable: true
          description: >-
            user id ของ Operation ที่ ConfigEngineer เจาะจงให้ดู Config นี้เป็นพิเศษ (v3.19 —
            Approval Center #19) · null = ไม่เจาะจง · ไม่ผูกมัด Operation คนอื่น
            ก็ approve ได้ · ตั้งค่าตอน decideConfig(passed:true) · Web resolve
            ชื่อจาก GET /users?role=Operation เอง
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConfigVersion:
      type: object
      description: >-
        Snapshot ของ Config ณ ตอนที่ Operation approve (append-only, Stage 5
        #26 ข้อ 9) — ตรงกับ Prisma model ConfigVersion ใช้เป็นต้นทางของ
        Rollback ใน Phase 4
      required:
        [id, configId, versionNumber, deviceModel, protocol, fields, approvedBy, approvedAt]
      properties:
        id:
          type: string
          format: uuid
        configId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          description: running number ต่อ config (1, 2, 3...) — อ้างอิงเวอร์ชันตอน Rollback
          example: 1
        deviceModel:
          type: string
        protocol:
          type: string
          example: TCP
        fields:
          type: object
          additionalProperties: true
          description: ค่า field ที่ถูก approve (สำเนา ณ ตอนนั้น — ไม่เปลี่ยนตาม Config ต้นทาง)
        approvedBy:
          type: string
          description: user id ของ Operation ที่กด approve เวอร์ชันนี้
        approvedAt:
          type: string
          format: date-time

    ConfigDeletionRequest:
      type: object
      description: >-
        คำขอลบ Config อัตโนมัติ (docs/11 Part A) — ตรงกับ Prisma model
        ConfigDeletionRequest · scheduled job สร้างเป็น `pending` · SuperAdmin
        approve (soft delete) / reject (cooldown) · ConfigEngineer/ผู้สร้าง keep -> cancelled
      required: [id, configId, reason, status, detectedAt]
      properties:
        id:
          type: string
          format: uuid
        configId:
          type: string
          format: uuid
        reason:
          type: string
          description: เหตุผลที่ job สร้างคำขอ (human-readable ให้ SuperAdmin อ่าน)
        status:
          type: string
          enum: [pending, approved, rejected, cancelled]
        detectedAt:
          type: string
          format: date-time
          description: เวลาที่ job ตรวจพบและสร้างคำขอ
        reviewedBy:
          type: string
          nullable: true
          description: user id ของ SuperAdmin ที่ approve/reject (null ถ้ายัง pending หรือถูก keep)
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        decisionNote:
          type: string
          nullable: true
          description: เหตุผลตอน reject (SuperAdmin กรอก)
        config:
          allOf:
            - $ref: "#/components/schemas/DeviceConfigDraft"
          description: Config ที่ถูกเสนอลบ (แนบมากับ listConfigDeletionRequests)

    ConfigFieldDefinition:
      type: object
      description: นิยาม field หนึ่งตัวใน Config Definition Lookup (ตรงกับ Prisma model ConfigFieldDefinition)
      required:
        [id, fieldName, dataType, allowedValues, required, unknownSpec, stOverridable, sensitive, restartRequired, createdAt, updatedAt, supportedModels]
      properties:
        id:
          type: string
          format: uuid
        fieldName:
          type: string
          example: APN
        dataType:
          type: string
          example: string
        allowedValues:
          type: array
          items:
            type: string
          description: ค่าที่ยอมรับได้ (ว่าง = ไม่จำกัดค่า)
        required:
          type: boolean
        unknownSpec:
          type: boolean
          description: field ที่รู้ว่ามีอยู่ในระบบเดิม แต่ยังไม่มี spec ยืนยันชัดเจน
        description:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
          description: >-
            หน่วยของค่า field นี้ (เช่น "วินาที", "KB", "%") — metadata สำหรับ
            แสดงผลข้างช่องกรอกตอนสร้าง Config เท่านั้น ไม่ถูกใช้ตอน validate
        stOverridable:
          type: boolean
          description: >-
            ST override ค่า field นี้บนอุปกรณ์ผ่าน POST /config/{id}/override
            ได้ไหม (issue #185) — OT ไม่มีสิทธิ์ override เลยไม่ว่าค่านี้จะเป็น
            อะไร (ไม่มี RBAC grant ให้ OT)
        category:
          type: string
          nullable: true
          description: >-
            หมวดหมู่ field สำหรับจัดกลุ่มแสดงผล (เช่น "Network", "Server",
            "Security") — ตรงกับ GPS_Config_Firmware_Center_Design.pdf §5.1
        sensitive:
          type: boolean
          description: >-
            field เก็บค่าอ่อนไหว (เช่น password, เบอร์โทร) — ใช้ซ่อนค่าบน
            หน้าจอฝั่ง Web เท่านั้น ไม่ได้เข้ารหัสค่าที่เก็บใน DB เพิ่ม
        restartRequired:
          type: boolean
          description: ต้อง Restart กล่องหลังเปลี่ยนค่า field นี้ไหม — metadata แสดงผลเท่านั้น
        defaultValue:
          type: string
          nullable: true
          description: >-
            ค่าเริ่มต้นของ field นี้ (issue #202) — string ดิบ parse ตาม
            dataType ตอนใช้งานจริง ฝั่ง Web ที่ ConfigWizard auto-fill ตอน
            สร้าง Config ใหม่เท่านั้น (v3.26) — ไม่ใช้ตอน Clone ที่ยังใช้ค่า
            จาก Config ต้นทางเหมือนเดิม
        supportedModels:
          type: array
          description: >-
            รุ่นอุปกรณ์/โปรโตคอลที่ field นี้ใช้ได้ (Semantic Validation
            v3.11) — Config ที่ deviceModel/protocol ไม่อยู่ในรายการนี้
            จะถูก block ตอน create/update Config
          items:
            $ref: "#/components/schemas/ConfigFieldDefinitionModelSupport"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConfigFieldDefinitionModelSupport:
      type: object
      description: คู่ (deviceModel, protocol) หนึ่งคู่ที่ field definition ใช้ได้
      required: [deviceModel, protocol]
      properties:
        deviceModel:
          type: string
          example: GT06N
        protocol:
          type: string
          example: TCP

    CreateConfigDefinitionInput:
      type: object
      description: Request body สำหรับ createConfigDefinition
      required: [fieldName, dataType, required, supportedModels]
      properties:
        fieldName:
          type: string
          example: APN1
        dataType:
          type: string
          example: string
        allowedValues:
          type: array
          items:
            type: string
        required:
          type: boolean
        unknownSpec:
          type: boolean
          default: false
          description: >-
            field ที่รู้ว่ามีอยู่ในระบบเดิม แต่ยังไม่มี spec ยืนยันชัดเจน
            (รู้แค่ชื่อ + dataType) — ปล่อยว่างได้ default false
        description:
          type: string
        unit:
          type: string
          maxLength: 20
          description: หน่วยของค่า field นี้ (เช่น "วินาที", "KB", "%") — ไม่บังคับ
        stOverridable:
          type: boolean
          default: false
          description: >-
            ST override ค่า field นี้บนอุปกรณ์ได้ไหม (issue #185) — ไม่บังคับ
            default false (override ไม่ได้เลยจนกว่าจะเปิดชัดเจน)
        category:
          type: string
          maxLength: 50
          description: >-
            หมวดหมู่ field สำหรับจัดกลุ่มแสดงผล (เช่น "Network", "Server",
            "Security") — ไม่บังคับ
        sensitive:
          type: boolean
          default: false
          description: field เก็บค่าอ่อนไหว (เช่น password, เบอร์โทร) — ไม่บังคับ
        restartRequired:
          type: boolean
          default: false
          description: ต้อง Restart กล่องหลังเปลี่ยนค่า field นี้ไหม — ไม่บังคับ
        defaultValue:
          type: string
          maxLength: 255
          description: >-
            ค่าเริ่มต้นของ field นี้ (issue #202) — ไม่บังคับ (v3.26)
        supportedModels:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ConfigFieldDefinitionModelSupport"

    # เพิ่มใหม่: แยกจาก DeviceConfigDraft เพราะ request body ของ createConfig/
    # updateConfig ไม่ควรรับ id/status จาก client (server เป็นคนกำหนดเท่านั้น —
    # DTO ฝั่ง backend ใช้ forbidNonWhitelisted ปฏิเสธ field แปลกปลอมอยู่แล้ว
    # ถ้า client ยิงตาม DeviceConfigDraft เป๊ะๆ พร้อม id/status จะโดน 400)
    ConfigWriteInput:
      type: object
      description: >-
        Request body สำหรับ createConfig/updateConfig — ไม่มี id/status (server
        กำหนดเอง) createConfig ต้องส่ง name/deviceModel/protocol/fields ครบ,
        updateConfig ส่งเฉพาะ field ที่จะแก้ (ทุกตัว optional)
      properties:
        name:
          type: string
          maxLength: 120
          description: >-
            ชื่อ Config ที่ผู้ใช้ตั้ง — unique ทั้งระบบ (มติ Sprint 1 review
            ข้อ 4) ชื่อซ้ำกับ Config อื่น -> 409
          example: GT06N · ตั้งค่ามาตรฐานภาคกลาง
        deviceModel:
          type: string
        protocol:
          type: string
          example: TCP
        fields:
          type: object
          additionalProperties: true
          description: ค่า field ตาม Config Definition Lookup (เช่น APN1, MTYP, SIM1)
        description:
          type: string
          maxLength: 500
          description: คำอธิบายสั้นๆ ว่า Config ชุดนี้ทำไว้เพื่ออะไร (ไม่บังคับ · ส่ง "" เพื่อล้างค่าตอน update)

    Task:
      type: object
      description: งานที่มอบหมายให้ทีมช่างหน้างาน (ตรงกับ Prisma model Task)
      required: [id, title, assignedTo, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        assignedTo:
          type: string
          description: user id ของผู้รับผิดชอบงาน
        deviceId:
          type: string
          nullable: true
          description: กล่อง GPS ที่เกี่ยวข้องกับงานนี้ (ถ้ามี)
        configId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Config ที่ Operation ผูกกับงานติดตั้ง/เปลี่ยน config — Mobile อ่านค่านี้
            ส่งเป็น body ของ POST /devices/{deviceId}/apply-config ตอนทำจอ Confirm
            Install · null สำหรับงานประเภทอื่น (เช็คสัญญาณ, เปลี่ยนซิม)
        campaignId:
          type: string
          nullable: true
          description: >-
            Campaign ต้นทางของงานนี้ (ถ้ามี) — ไม่ใส่ format: uuid เพราะที่ระดับ
            Prisma ไม่มี relation constraint ไปยัง Campaign.id (mirror deviceId)
            · **เป็น null เสมอในทางปฏิบัติ** (แก้ไข 2026-09-14): เดิมตั้งใจให้
            `POST /campaigns` สร้าง Task พร้อม campaignId นี้เป็นขั้น "มอบหมาย
            ผู้รับผิดชอบหน้างาน" แต่หัวหน้าแก้ scope ว่า Campaign ไม่มอบหมายงาน
            ให้ช่างหน้างานอีกต่อไป (เป็นหน้าที่ของระบบแยกที่บริษัทมีอยู่แล้ว)
            field นี้เหลือไว้เผื่ออนาคตมีช่องทางอื่นเชื่อม Task เข้ากับ Campaign
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
        dueDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskCreateRequest:
      type: object
      required: [title, assignedTo]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        assignedTo:
          type: string
        deviceId:
          type: string
        configId:
          type: string
          format: uuid
          description: >-
            ต้องเป็น Config สถานะ approved หรือ synced เท่านั้น — ถ้าระบุ deviceId
            ด้วยและมี Device record จริง deviceModel/protocol ต้องตรงกัน
        dueDate:
          type: string
          format: date-time

    TaskUpdateRequest:
      type: object
      description: ส่งเฉพาะ field ที่ต้องการแก้ (partial update)
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        assignedTo:
          type: string
        deviceId:
          type: string
          nullable: true
        configId:
          type: string
          format: uuid
          nullable: true
          description: >-
            ผูก/เปลี่ยน Config ของงาน (Operation เท่านั้น — ST/OT แก้ได้เฉพาะ status)
            ส่ง null เพื่อล้างค่า · เงื่อนไข Config เหมือน TaskCreateRequest.configId
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
        dueDate:
          type: string
          format: date-time
          nullable: true

    Firmware:
      type: object
      description: >-
        1 ไฟล์ Firmware ที่อัปโหลดเข้าระบบ (v3.23) — `objectKey`/
        `originalFilename`/`fileSizeBytes` ปิด gap ที่ `01_GPS_Build_Reference.md`
        §3 ระบุไว้แต่แรกว่าต้องมี "path ใน Object Storage" แต่ schema เดิม
        (ก่อน Sprint 3 #23) ไม่มี field เก็บ reference ไฟล์เลยสักตัว ·
        `approvalStatus`/`approvedBy` เพิ่มโดย Firmware Approval Lifecycle
        (docs/13_Role_Redesign_Proposal.md §3.2 — PR ถัดจาก #178)
      required:
        [
          id,
          version,
          deviceModelCompatibility,
          uploadStatus,
          deviceUpdateStatus,
          objectKey,
          originalFilename,
          fileSizeBytes,
          uploadedBy,
          uploadedAt,
          approvalStatus,
          approvedBy,
        ]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        deviceModelCompatibility:
          type: array
          items:
            type: string
        uploadStatus:
          type: string
          description: สถานะอัปโหลด/จัดเก็บฝั่งเรา (v3.7)
          enum: [pending, stored, failed]
        deviceUpdateStatus:
          type: string
          description: >-
            สถานะอัปเดตเวอร์ชันจริงของกล่อง อ้างอิงจาก device-status (v3.7) —
            ยังคงเป็น `unknown` เสมอในเวอร์ชันนี้ (v3.23) เพราะ device-status
            ยังไม่ implement (ดู RBAC_Matrix.md Section 6)
          enum: [unknown, up_to_date, pending_update]
        objectKey:
          type: string
          description: >-
            key/path ใน Object Storage bucket (ภายใน — ไม่มี endpoint ให้
            download ไฟล์กลับตอนนี้ เก็บไว้เผื่ออนาคต)
        originalFilename:
          type: string
        fileSizeBytes:
          type: integer
        uploadedBy:
          type: string
          format: uuid
        uploadedAt:
          type: string
          format: date-time
        approvalStatus:
          type: string
          description: >-
            สถานะอนุมัติคุณภาพ (Firmware Approval Lifecycle, docs/13 §3.2) —
            คนละมิติกับ uploadStatus ด้านบน (uploadStatus = ผลทางเทคนิคของ
            การอัปโหลด, approvalStatus = QAEngineer ตรวจคุณภาพแล้วหรือยัง)
            ต้อง `approved` ควบคู่กับ uploadStatus `stored` ถึงใช้สร้าง
            Campaign ได้ (`createCampaign`)
          enum: [pending_review, approved, rejected]
        approvedBy:
          type: string
          format: uuid
          nullable: true
          description: >-
            user id ของ QAEngineer ที่อนุมัติ — null จนกว่าจะถูกอนุมัติ
            (ตอน reject ก็ยังเป็น null เช่นกัน — ไม่มีใคร "อนุมัติ" การ reject)

    SimulationResult:
      type: object
      properties:
        passed:
          type: boolean
        details:
          type: array
          items:
            type: string

    DeviceConnectionTestResult:
      type: object
      description: ผลทดสอบการเชื่อมต่อของอุปกรณ์ที่ติดตั้งจริง (`testDeviceConnection`)
      required: [passed, signalStrength, details, testedAt]
      properties:
        passed:
          type: boolean
        signalStrength:
          type: integer
          description: ความแรงสัญญาณ (dBm) — mock mode คืนค่าคงที่ให้ Mobile ทำ/ทดสอบ UI ได้
          example: -65
        details:
          type: array
          items:
            type: string
        testedAt:
          type: string
          format: date-time

    ConfigApplyInput:
      type: object
      description: Request body สำหรับ applyConfigToDevice
      required: [configId]
      properties:
        configId:
          type: string
          format: uuid
          description: id ของ Config ที่จะใส่ (ต้องเป็นสถานะ approved หรือ synced)

    SimulateConfigOnDeviceInput:
      type: object
      description: >-
        Request body สำหรับ simulateConfigOnDevice — shape เหมือน
        `ConfigApplyInput` ตอนนี้ แต่แยก schema ไว้เพื่อไม่ผูก 2 endpoint
        เข้าด้วยกัน (ตรงกับ `SimulateConfigOnDeviceDto` ฝั่ง TS)
      required: [configId]
      properties:
        configId:
          type: string
          format: uuid
          description: id ของ Config ที่จะเช็คความพร้อม (ต้องเป็นสถานะ approved หรือ synced)

    ConfigApplyResult:
      type: object
      description: >-
        ผลการใส่ Config ให้อุปกรณ์ (`applyConfigToDevice`) — ไม่มีสถานะอุปกรณ์
        เพราะกล่องรับค่าเมื่อเปิดเครื่องครั้งถัดไปเท่านั้น (ไม่มี ack แบบ synchronous)
      required: [applied, details, appliedAt]
      properties:
        applied:
          type: boolean
          description: "ถ้า false = ค่าใน Config ไม่ผ่านการตรวจเบื้องต้น (ดู details)"
        details:
          type: array
          items:
            type: string
        appliedAt:
          type: string
          format: date-time
          description: เวลาที่ server รับคำสั่ง (ไม่ใช่เวลาที่กล่องรับค่าจริง)

    ConfirmFirmwareInstallInput:
      type: object
      description: Request body สำหรับ confirmFirmwareInstall (issue #181)
      required: [firmwareId]
      properties:
        firmwareId:
          type: string
          format: uuid
          description: >-
            id ของ Firmware ที่ช่างยืนยันว่าติดตั้งเสร็จแล้ว — ต้องเป็นสถานะ
            uploadStatus:stored และ approvalStatus:approved และรองรับรุ่น
            อุปกรณ์เครื่องนี้ (deviceModelCompatibility)

    ConfirmFirmwareInstallResult:
      type: object
      description: >-
        ผลการยืนยัน (`confirmFirmwareInstall`) — ไม่มี field สถานะอุปกรณ์ใดๆ
        เพราะ endpoint นี้ไม่คำนวณ Firmware.deviceUpdateStatus จริง (ยังคง
        unknown ต่อไป, มติ issue #181 ข้อ 3)
      required: [deviceId, firmwareId, confirmedAt]
      properties:
        deviceId:
          type: string
          description: "Device.deviceId (เลขเครื่องจริง)"
        firmwareId:
          type: string
          format: uuid
        confirmedAt:
          type: string
          format: date-time
          description: เวลาที่ backend บันทึกการยืนยัน (ไม่ใช่เวลาที่ช่างติดตั้งจริงหน้างาน)

    DeviceSimulateConfigResult:
      type: object
      description: >-
        ผลเช็คความพร้อมของ Config บนอุปกรณ์เครื่องหนึ่ง (`simulateConfigOnDevice`)
        — รวม 3 ส่วนเป็นผลเดียว ไม่มีส่วนไหนเป็น null (endpoint บังคับส่งทั้ง
        deviceId และ configId เสมอ). แยก schema จาก `SimulationResult` เดิม
        (ใช้ร่วมกับ Web Config Editor dry-run) โดยตั้งใจ
      required: [passed, configCheck, compatibilityCheck, connectionCheck]
      properties:
        passed:
          type: boolean
          description: true เมื่อ configCheck, compatibilityCheck, connectionCheck ผ่านทั้งหมด
        configCheck:
          allOf:
            - $ref: "#/components/schemas/SimulationResult"
          description: ตัว Config เองพร้อมไหม (ผลจาก Device Simulator)
        compatibilityCheck:
          type: object
          description: deviceModel/protocol ของ Config ตรงกับอุปกรณ์เครื่องนี้ไหม
          required: [passed, details]
          properties:
            passed:
              type: boolean
            details:
              type: array
              items:
                type: string
        connectionCheck:
          allOf:
            - $ref: "#/components/schemas/DeviceConnectionTestResult"
          description: สัญญาณของกล่องเครื่องนั้น (ผลจาก Device Connection Tester)

    Device:
      type: object
      description: >-
        อุปกรณ์ GPS หนึ่งเครื่อง (ตรงกับ Prisma model Device — MVP ตาม
        ../planning/03_GPS_Detailed_Build_Steps.md Phase 0 ข้อ 8 · ยังไม่มี FK
        ไป Vehicle/HardwareRevision ตาม Data Dictionary (`customer` เพิ่มแล้ว
        — docs/12_CustomerScope_Proposal.md เฟส B, PR #127/#153) — ดู
        schema.prisma comment)
      required:
        [id, deviceId, simNumber, deviceModel, protocol, status, registeredAt]
      properties:
        id:
          type: string
          format: uuid
          description: surrogate key ภายใน (ใช้ทำ FK/index) — client อ้างอิงด้วย deviceId
        deviceId:
          type: string
          description: เลขเครื่องจริงที่ช่างกรอก/สแกนตอนลงทะเบียน (unique)
          example: DEV-0001
        simNumber:
          type: string
        deviceModel:
          type: string
          example: GT06N
        protocol:
          type: string
          example: TCP
        status:
          type: string
          enum: [registered, installed, decommissioned]
        registeredAt:
          type: string
          format: date-time
        installedAt:
          type: string
          format: date-time
          nullable: true
        customer:
          type: object
          allOf:
            - $ref: "#/components/schemas/CustomerSummary"
          nullable: true
          description: >-
            ลูกค้าที่ผูกกับอุปกรณ์นี้ (ถ้ามี) — null = ยังไม่ได้กำหนดลูกค้า
            รอบนี้เป็น read-only เท่านั้น ยังไม่มี endpoint กำหนด/แก้ลูกค้า
            ของอุปกรณ์ (ดู docs/12 เฟส B ส่วน "ยังไม่ทำ")

    CustomerSummary:
      type: object
      description: >-
        ข้อมูลลูกค้าแบบย่อ (listCustomers, embed ใน Device) — id + ชื่อบริษัท
        เท่านั้น ไม่มี contactName/email/phone/priorityTier (docs/12
        เฟส B, PR #127/#153) — ทุก role ที่ login แล้วเรียกได้ ไม่ควรคืน
        ข้อมูลติดต่อของลูกค้าที่ละเอียดกว่านี้
      required: [id, companyName]
      properties:
        id:
          type: string
          format: uuid
        companyName:
          type: string
          example: ABC Logistics

    Incident:
      type: object
      description: >-
        เหตุการณ์ผิดปกติ 1 รายการ (ตรงกับ Prisma model Incident) — รอบนี้
        สร้างอัตโนมัติจาก config-sync-writer เท่านั้น (source =
        'config-sync-writer') ช่องทางสร้างอื่นยังไม่เปิด
      required: [id, title, severity, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        severity:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [open, investigating, rolled_back, resolved]
        relatedConfigId:
          type: string
          nullable: true
        relatedFirmwareId:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
          example: config-sync-writer
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DeviceStatus:
      type: object
      properties:
        deviceId:
          type: string
        configStatus:
          type: string
        firmwareStatus:
          type: string
        lastCheckInMessage:
          type: string
          example: "จะได้รับการอัปเดตในการเปิดเครื่องครั้งถัดไปของกล่อง"

    Notification:
      type: object
      description: Notification record ของ user (ตรงกับ Prisma model Notification)
      required: [id, userId, type, payload, read, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          description: user id ของเจ้าของ notification
        type:
          type: string
          enum:
            - task_assigned
            - config_approved
            - config_rejected
            - firmware_ready
            - incident_alert
            - config_deletion_pending
            - config_deletion_grace
        payload:
          type: object
          additionalProperties: true
          description: ข้อมูลเพิ่มเติมของ notification (JSON)
        read:
          type: boolean
          description: true = อ่านแล้ว
        sentAt:
          type: string
          format: date-time
          nullable: true
          description: เวลาที่ส่งออกจริง (null = ยังไม่ได้ส่ง)
        createdAt:
          type: string
          format: date-time

    DeviceToken:
      type: object
      description: FCM device token ของ user (ตรงกับ Prisma model DeviceToken)
      required: [id, userId, token, platform, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          description: user id ของเจ้าของ token (ผูกจาก JWT)
        token:
          type: string
          description: FCM registration token
        platform:
          type: string
          enum: [android, ios, web]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterDeviceTokenInput:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          minLength: 1
          description: FCM registration token ของเครื่อง
        platform:
          type: string
          enum: [android, ios, web]
