        PermissionGuard — pattern เดียวกับ `/users`/`/customers`) · เรียงตาม
        ชื่อรุ่น · ใช้ทำ dropdown เลือกรุ่นตอนสร้าง Config/เพิ่มอุปกรณ์
      responses:
