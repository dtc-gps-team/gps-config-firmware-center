          description: รายชื่อรุ่นอุปกรณ์ทั้งหมด (เรียงตามชื่อ)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceModel"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
    post:
      tags: [device-model]
      operationId: createDeviceModel
      summary: สร้างรุ่นอุปกรณ์ใหม่ (Admin/SuperAdmin เท่านั้น — v3.28, issue #209)
