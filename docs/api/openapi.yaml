openapi: 3.0.3
info:
  title: GPS Config & Firmware Center API
  description: >
    โครง API เริ่มต้นสำหรับ Sprint 0 — ยังไม่ครบทุก Endpoint
    เพิ่มเติมทีละ Phase ตามที่ Build จริง (ดู 01_GPS_Build_Reference.md Section 3)
  version: "0.1.0"
servers:
  - url: http://localhost:3001/api/v1
    description: Local dev

# บังคับ Bearer JWT ทุก endpoint โดย default — override เป็น security: [] เฉพาะ endpoint ที่เป็น public
security:
  - bearerAuth: []

tags:
  - name: auth
    description: Login และการยืนยันตัวตน (JWT)
  - name: config
    description: จัดการ Device Config — สร้าง/นำเข้า/ทดสอบ/อนุมัติ
  - name: firmware
    description: อัปโหลดและทดสอบ Firmware ของกล่อง
  - name: device-status
    description: สถานะ Config และ Firmware รายกล่อง
  - name: device
    description: การทำงานกับตัวกล่อง — ทดสอบการเชื่อมต่อ/สัญญาณ
  - name: task
    description: มอบหมาย/ติดตามงานให้ทีมช่างหน้างาน (เชื่อมกับ Mobile app)
  - name: notification
    description: Notification ของ user ปัจจุบัน — list และ mark อ่านแล้ว

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login ด้วย Username/Password
      security: []   # public — ยังไม่มี token ตอนเรียก login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login สำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Username/Password ไม่ถูกต้อง

  /config:
    get:
      tags: [config]
      operationId: listConfigs
      summary: ดึงรายการ Config ทั้งหมด (แบ่งตาม status)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, testing, approved, rejected, synced]
      responses:
        "200":
          description: รายการ Config
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceConfigDraft"
        "400":
          description: ค่า query parameter status ไม่ถูกต้อง
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
    post:
      tags: [config]
      operationId: createConfig
      summary: สร้าง Config ใหม่ผ่านฟอร์ม (Draft)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigWriteInput"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "400":
          description: ข้อมูล Config ไม่ถูกต้อง (validation ตาม Config Definition Lookup)
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์สร้าง Config — เฉพาะ Role SW เท่านั้น

  # เพิ่มใหม่: GET/PUT/DELETE Config รายตัว (เดิมมีแค่ list/create/import/
  # simulate/approve/reject)
  /config/{configId}:
    get:
      tags: [config]
      operationId: getConfig
      summary: ดึงรายละเอียด Config รายตัว
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: รายละเอียด Config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ Config นี้
    put:
      tags: [config]
      operationId: updateConfig
      summary: แก้ไข Config ที่ยังเป็นสถานะ draft
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigWriteInput"
      responses:
        "200":
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "400":
          description: ข้อมูล Config ไม่ถูกต้อง (validation ตาม Config Definition Lookup)
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์แก้ไข Config — เฉพาะ Role SW เท่านั้น
        "404":
          description: ไม่พบ Config นี้
        "409":
          description: สถานะ Config ปัจจุบันไม่ใช่ draft จึงแก้ไขไม่ได้
    delete:
      tags: [config]
      operationId: deleteConfig
      summary: ลบ Config ที่ยังเป็นสถานะ draft
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: ลบสำเร็จ
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ลบ Config — เฉพาะ Role SW เท่านั้น
        "404":
          description: ไม่พบ Config นี้
        "409":
          description: สถานะ Config ปัจจุบันไม่ใช่ draft จึงลบไม่ได้

  /config/import:
    post:
      tags: [config]
      operationId: importConfig
      summary: Import Config จากไฟล์ (v3.2 — รองรับ JSON เป็นจุดเริ่มต้น)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                format:
                  type: string
                  enum: [json]
      responses:
        "201":
          description: Import สำเร็จ แปลงเป็น DeviceConfigDraft แล้ว เข้า flow ทดสอบ/อนุมัติเดียวกับฟอร์ม
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "400":
          description: ไฟล์หรือ format ไม่ถูกต้อง (รองรับเฉพาะ JSON) หรือแปลงเป็น DeviceConfigDraft ไม่สำเร็จ
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ Import Config — เฉพาะ Role SW เท่านั้น
        "413":
          description: ไฟล์มีขนาดเกิน limit ที่กำหนดไว้ (1MB)

  /config/{configId}/simulate:
    post:
      tags: [config]
      operationId: simulateConfig
      summary: ทดสอบ Config กับ Device Simulator (ใช้ทั้งฝั่ง Web และ Mobile — v3.5)
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      requestBody:
        # required: false (v3.9 — แก้ตาม code review ของ kittiphong บน PR
        # Stage 3: ConfigController.simulate ไม่รับ @Body() เลยจริงๆ — เดิม
        # required: true ทำให้ client ที่ gen จาก spec ตรงๆ ถูกบังคับส่ง body
        # ที่ backend ไม่สนใจอยู่ดี ส่วน `deviceModel` ใน schema ก็ไม่ถูกใช้
        # เลย (ConfigService.simulate ใช้ deviceModel/protocol/fields จาก DB
        # ของ Config นั้นเสมอ ไม่รับจาก client) เก็บ property นี้ไว้เป็นข้อมูล
        # อ้างอิงเฉยๆ
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceModel:
                  type: string
      responses:
        "200":
          description: ผลทดสอบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "400":
          description: deviceModel ไม่ถูกต้องหรือไม่รองรับ
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ทดสอบ Config นี้ — เฉพาะ Role SW, Operation, ST, OT
        "404":
          description: ไม่พบ Config นี้
        "409":
          description: สถานะ Config ปัจจุบันไม่รองรับการทดสอบ (เช่น approved/synced ไปแล้ว)

  /config/{configId}/decide:
    post:
      tags: [config]
      operationId: decideConfig
      summary: SW ปักผลตัดสินใจผ่าน/ไม่ผ่านเองหลังดูผล simulate แล้ว (Stage 4)
      description: >-
        `passed:true` เปลี่ยนสถานะจาก draft เป็น testing (ส่งต่อให้ Operation
        อนุมัติ/ปฏิเสธต่อ) — `passed:false` ไม่เปลี่ยนสถานะเลย (ยังเป็น draft
        เหมือนเดิม ให้ SW แก้ไขต่อได้)
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passed]
              properties:
                passed:
                  type: boolean
      responses:
        "200":
          description: ปักผลสำเร็จ (ไม่ว่า passed จะเป็น true หรือ false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "400":
          description: ไม่ส่ง passed มา หรือ passed ไม่ใช่ boolean
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ปักผลตัดสินใจ Config — เฉพาะ Role SW เท่านั้น
        "404":
          description: ไม่พบ Config นี้
        "409":
          description: สถานะ Config ปัจจุบันไม่ใช่ draft จึงปักผลตัดสินใจไม่ได้ (เช่น ยังไม่เคย simulate เลย หรือส่งต่อ Operation ไปแล้ว)

  /config/{configId}/approve:
    post:
      tags: [config]
      operationId: approveConfig
      summary: Operation อนุมัติ Config
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: อนุมัติสำเร็จ — เข้า flow config-sync-writer ต่อ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์อนุมัติ Config — เฉพาะ Role Operation เท่านั้น
        "404":
          description: ไม่พบ Config นี้
        "409":
          description: สถานะ Config ปัจจุบันไม่ใช่ testing จึงอนุมัติไม่ได้

  /config/{configId}/reject:
    post:
      tags: [config]
      operationId: rejectConfig
      summary: Operation ปฏิเสธ Config (สถานะย้อนกลับไป Draft ทั้งหมด)
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ปฏิเสธสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigDraft"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ปฏิเสธ Config — เฉพาะ Role Operation เท่านั้น
        "404":
          description: ไม่พบ Config นี้
        "409":
          description: สถานะ Config ปัจจุบันไม่ใช่ testing จึงปฏิเสธไม่ได้

  # เพิ่มใหม่ (Stage 5, #26 ข้อ 9): ประวัติเวอร์ชันของ Config — snapshot
  # append-only ทุกครั้งที่ Operation approve เป็นฐานของ Rollback ใน Phase 4
  /config/{configId}/versions:
    get:
      tags: [config]
      operationId: listConfigVersions
      summary: ดึงประวัติเวอร์ชันทั้งหมดของ Config (เรียงล่าสุดก่อน — v3.12 Stage 5 #26 ข้อ 9)
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: รายการ ConfigVersion (ว่าง = Config ยังไม่เคยถูก approve)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigVersion"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ Config นี้

  /config/{configId}/versions/{versionNumber}:
    get:
      tags: [config]
      operationId: getConfigVersion
      summary: ดึง snapshot เวอร์ชันเดียวตาม versionNumber (v3.12 — ต้นทางของ Rollback Phase 4)
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
        - in: path
          name: versionNumber
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ConfigVersion (มี fields เต็ม — ใช้เป็นต้นทางของ Rollback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigVersion"
        "400":
          description: versionNumber ไม่ใช่จำนวนเต็ม
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ Config นี้ หรือไม่พบเวอร์ชันที่ระบุ

  /config-definitions:
    get:
      tags: [config]
      operationId: listConfigDefinitions
      summary: ดึง catalog ของ Config Field Definition ทั้งหมด (Config Definition Lookup — v3.10)
      description: >-
        รายการ field ที่ระบบรู้จัก (ชื่อ field, ชนิดข้อมูล, ค่าที่ยอมรับ,
        บังคับกรอกไหม, รุ่นอุปกรณ์/โปรโตคอลที่ใช้ได้) ใช้อ้างอิงตอนกรอก/ตรวจ
        Config
      responses:
        "200":
          description: รายการ Config Field Definition ทั้งหมด (เรียงตาม fieldName)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigFieldDefinition"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์อ่าน Config Definition — เฉพาะ Role SW, Operation, ST, OT
    post:
      tags: [config]
      operationId: createConfigDefinition
      summary: สร้าง Config Field Definition ใหม่ (Semantic Validation — v3.11)
      description: >-
        SW สร้าง field definition ใหม่ในคลังเอง ไม่ต้องผ่านขั้นตอนอนุมัติ
        เพราะ field ที่มีปัญหาจริงจะโดนจับตอนเอาไปสร้าง Config Template แล้ว
        เข้า simulate/decide/approve อยู่ดี (ตัดสินใจร่วมกับทีมและพี่เลี้ยง
        2569-09 — ดู RBAC_Matrix.md changelog) `supportedModels` ต้องระบุ
        อย่างน้อย 1 คู่ (deviceModel, protocol) เสมอ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConfigDefinitionInput"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigFieldDefinition"
        "400":
          description: ข้อมูลไม่ผ่าน validation (เช่น supportedModels ว่างเปล่า)
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์สร้าง Config Definition — เฉพาะ Role SW
        "409":
          description: มี field ชื่อนี้อยู่แล้วในคลัง (fieldName ซ้ำ)

  /notifications:
    get:
      tags: [notification]
      operationId: listNotifications
      summary: ดึงรายการ Notification ของ user ปัจจุบัน (จาก JWT)
      parameters:
        - in: query
          name: unread
          description: กรองเฉพาะ notification ที่ยังไม่ได้อ่าน (read=false)
          schema:
            type: boolean
      responses:
        "200":
          description: รายการ Notification
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "400":
          description: ค่า query parameter ไม่ถูกต้อง
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ

  /notifications/{notificationId}/read:
    patch:
      tags: [notification]
      operationId: markNotificationRead
      summary: ทำเครื่องหมาย Notification ว่าอ่านแล้ว (read = true)
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: อัปเดตสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ Notification นี้

  /tasks:
    get:
      tags: [task]
      operationId: listTasks
      summary: ดึงรายการงานทั้งหมด (กรองด้วย status / assignedTo ได้)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, completed, cancelled]
        - in: query
          name: assignedTo
          description: กรองเฉพาะงานของผู้รับผิดชอบคนใดคนหนึ่ง (user id)
          schema:
            type: string
      responses:
        "200":
          description: รายการงาน
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "400":
          description: ค่า query parameter ไม่ถูกต้อง
    post:
      tags: [task]
      operationId: createTask
      summary: สร้างงานใหม่ (status เริ่มต้นเป็น pending)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: สร้างงานสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: ข้อมูลไม่ถูกต้อง (รวมถึง configId ไม่ใช่ uuid)
        "403":
          description: ไม่มีสิทธิ์สร้างงาน — เฉพาะ Role Operation เท่านั้น
        "404":
          description: ไม่พบ Config (configId) ที่ระบุ
        "409":
          description: >-
            configId ที่ระบุยังผูกกับงานไม่ได้ — Config ยังไม่ approved/synced
            หรือ deviceModel/protocol ไม่ตรงกับ Device ของงาน

  /tasks/{taskId}:
    get:
      tags: [task]
      operationId: getTask
      summary: ดึงรายละเอียดงาน 1 รายการ
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: รายละเอียดงาน
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: taskId ไม่ใช่ uuid ที่ถูกต้อง
        "404":
          description: >-
            ไม่พบงานนี้ (รวมถึงกรณี ST/OT พยายามดูงานที่ไม่ใช่ของตัวเอง — ตอบ 404
            แทน 403 เพื่อไม่เปิดเผยว่ามี record นี้อยู่)
    patch:
      tags: [task]
      operationId: updateTask
      summary: แก้ไขงาน (เช่น เปลี่ยน status, ผู้รับผิดชอบ, กำหนดส่ง)
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdateRequest"
      responses:
        "200":
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: ข้อมูลไม่ถูกต้อง (รวมถึง configId ไม่ใช่ uuid)
        "403":
          description: >-
            ไม่มีสิทธิ์แก้ไขงานนี้ — Operation แก้ได้ทุก field, ST/OT แก้ได้เฉพาะ
            field status ของงานที่ตัวเองถูก assign เท่านั้น (role อื่นแก้ไม่ได้เลย
            — ST/OT ที่ส่ง configId มาด้วยก็ถือเป็น 403)
        "404":
          description: >-
            ไม่พบงานนี้ (รวมถึงกรณี ST/OT พยายามแก้งานที่ไม่ใช่ของตัวเอง — ตอบ 404
            แทน 403 เพื่อไม่เปิดเผยว่ามี record นี้อยู่) หรือไม่พบ Config (configId)
            ที่ระบุ
        "409":
          description: >-
            configId ที่ระบุยังผูกกับงานไม่ได้ — Config ยังไม่ approved/synced
            หรือ deviceModel/protocol ไม่ตรงกับ Device ของงาน

  /firmware:
    get:
      tags: [firmware]
      operationId: listFirmware
      summary: รายการ Firmware ที่อัปโหลดเข้าระบบ
      responses:
        "200":
          description: รายการ Firmware
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Firmware"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
    post:
      tags: [firmware]
      operationId: uploadFirmware
      summary: อัปโหลด Firmware เข้าระบบเราโดยตรง (v3.7 — ทางเดียว ไม่มีช่องทางดึงจากระบบเดิมแล้ว)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                deviceModel:
                  type: string
      responses:
        "201":
          description: อัปโหลดสำเร็จ — แสดง upload_status บนหน้าเว็บ
        "400":
          description: ไฟล์หรือ deviceModel ไม่ถูกต้อง
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์อัปโหลด Firmware — เฉพาะ Role SW เท่านั้น

  /firmware/{firmwareId}/simulate:
    post:
      tags: [firmware]
      operationId: simulateFirmware
      summary: ทดสอบ Firmware กับ Device Simulator (ใช้ทั้งฝั่ง Web และ Mobile — v3.5)
      parameters:
        - in: path
          name: firmwareId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceModel:
                  type: string
      responses:
        "200":
          description: ผลทดสอบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "400":
          description: deviceModel ไม่ถูกต้องหรือไม่รองรับ
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ทดสอบ Firmware นี้ — เฉพาะ Role SW, Operation, ST, OT
        "404":
          description: ไม่พบ Firmware นี้
        "409":
          description: uploadStatus ของ Firmware ยังไม่พร้อมทดสอบ (เช่น pending/failed)

  /devices/{deviceId}/status:
    get:
      tags: [device-status]
      operationId: getDeviceStatus
      summary: >
        ดูสถานะกล่อง (Config + Firmware) — ครอบคลุมทั้งสถานะ Config
        และสถานะอัปเดตเวอร์ชัน Firmware ของตัวกล่อง (v3.7)
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: สถานะล่าสุด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "404":
          description: ไม่พบ Device นี้

  /devices/{deviceId}/test-connection:
    post:
      tags: [device]
      operationId: testDeviceConnection
      summary: ทดสอบการเชื่อมต่อ/สัญญาณของอุปกรณ์ที่ติดตั้งจริง (v3.11)
      description: >-
        สำหรับช่างหน้างาน (ST/OT ผ่าน Mobile) ทดสอบสัญญาณอุปกรณ์เครื่องที่
        ติดตั้งจริงแล้ว — ต่างจาก `simulateConfig` ที่เป็น dry-run ตรวจค่า field
        ของ Config template (สถานะ `draft`/`testing`). อ้างด้วยเลขเครื่องจริง
        (`Device.deviceId`) ไม่มี request body — server ดึงข้อมูล Device จาก DB เอง
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ผลทดสอบการเชื่อมต่อ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConnectionTestResult"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ทดสอบการเชื่อมต่ออุปกรณ์ — เฉพาะ Role ST, OT
        "404":
          description: ไม่พบ Device (deviceId) นี้
        "409":
          description: Device ยังไม่ถึงสถานะ installed (ยังเป็น registered หรือ decommissioned ไปแล้ว) จึงทดสอบสัญญาณไม่ได้

  /devices/{deviceId}/apply-config:
    post:
      tags: [device]
      operationId: applyConfigToDevice
      summary: ใส่ Config ที่อนุมัติแล้วให้อุปกรณ์ที่ติดตั้งจริง (v3.13)
      description: >-
        สำหรับช่างหน้างาน (ST/OT ผ่าน Mobile) — เลือก Config ที่ผูกกับ Task
        ที่กำลังทำ แล้วส่งให้อุปกรณ์เครื่องนั้น. **ไม่ persist / ไม่แตะสถานะใดๆ**
        (fire-and-forget) — กล่องจะรับค่าเมื่อเปิดเครื่องครั้งถัดไป
        (01_GPS_Build_Reference.md §4.2) จึงไม่มีสถานะอุปกรณ์หลัง apply ใน response.
        โหมด mock ตรวจค่าเบื้องต้น (field ≥ 1, Timeout/Interval ไม่ติดลบ)
        แล้วคืน `applied: true`
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigApplyInput"
      responses:
        "200":
          description: "ผลการ apply (applied=false = ค่าใน Config ไม่ผ่านการตรวจเบื้องต้น)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigApplyResult"
        "400":
          description: configId ไม่ใช่ uuid ที่ถูกต้อง
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ
        "403":
          description: ไม่มีสิทธิ์ใส่ Config ให้อุปกรณ์ — เฉพาะ Role ST, OT
        "404":
          description: ไม่พบ Device (deviceId) นี้ หรือไม่พบ Config (configId) นี้
        "409":
          description: >-
            ใส่ Config ไม่ได้ — Device ยังไม่ installed / Config ยังไม่ผ่านอนุมัติ
            (ต้อง approved หรือ synced) / Config คนละ deviceModel/protocol กับ Device

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        role:
          type: string
          # เดิม enum ตายตัว [SW, Operation, ST, OT, Auditor, Admin] — เปลี่ยนเป็น
          # free-form string แล้ว เพราะ Role เปลี่ยนจาก Postgres enum เป็นตารางจริง
          # (feature/rbac-role-table, 2026-08-28) Admin สร้าง Role ใหม่ผ่านหน้า
          # User/Role Management ได้เอง ค่า role ที่ส่งกลับมาจึงไม่ใช่ค่าคงที่ 6 ตัวอีกต่อไป
          description: >-
            Role code ของผู้ใช้ (เช่น SW, Operation, ST, OT, Auditor, Admin
            หรือ role อื่นที่ Admin สร้างเพิ่มภายหลัง)
          example: SW

    DeviceConfigDraft:
      type: object
      description: โครงสร้างกลางที่ทั้งฟอร์มและ Import JSON แปลงเข้ามาเป็นแบบเดียวกัน (response shape — มี id/status ที่ server เป็นคนกำหนด)
      properties:
        id:
          type: string
        deviceModel:
          type: string
        protocol:
          type: string
          example: TCP
        status:
          type: string
          enum: [draft, testing, approved, rejected, synced]
        fields:
          type: object
          additionalProperties: true
          description: ค่า field ตาม Config Definition Lookup (เช่น APN1, MTYP, SIM1)
        createdBy:
          type: string
          description: user id ของ SW ที่สร้าง Config นี้ (server กำหนดจาก JWT)
        approvedBy:
          type: string
          nullable: true
          description: >-
            user id ของ Operation ที่กดอนุมัติ (null = ยังไม่อนุมัติ) — ตั้งค่าโดย
            approveConfig เพื่อเป็นร่องรอย Separation of Duty
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConfigVersion:
      type: object
      description: >-
        Snapshot ของ Config ณ ตอนที่ Operation approve (append-only, Stage 5
        #26 ข้อ 9) — ตรงกับ Prisma model ConfigVersion ใช้เป็นต้นทางของ
        Rollback ใน Phase 4
      required:
        [id, configId, versionNumber, deviceModel, protocol, fields, approvedBy, approvedAt]
      properties:
        id:
          type: string
          format: uuid
        configId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          description: running number ต่อ config (1, 2, 3...) — อ้างอิงเวอร์ชันตอน Rollback
          example: 1
        deviceModel:
          type: string
        protocol:
          type: string
          example: TCP
        fields:
          type: object
          additionalProperties: true
          description: ค่า field ที่ถูก approve (สำเนา ณ ตอนนั้น — ไม่เปลี่ยนตาม Config ต้นทาง)
        approvedBy:
          type: string
          description: user id ของ Operation ที่กด approve เวอร์ชันนี้
        approvedAt:
          type: string
          format: date-time

    ConfigFieldDefinition:
      type: object
      description: นิยาม field หนึ่งตัวใน Config Definition Lookup (ตรงกับ Prisma model ConfigFieldDefinition)
      required:
        [id, fieldName, dataType, allowedValues, required, unknownSpec, createdAt, updatedAt, supportedModels]
      properties:
        id:
          type: string
          format: uuid
        fieldName:
          type: string
          example: APN
        dataType:
          type: string
          example: string
        allowedValues:
          type: array
          items:
            type: string
          description: ค่าที่ยอมรับได้ (ว่าง = ไม่จำกัดค่า)
        required:
          type: boolean
        unknownSpec:
          type: boolean
          description: field ที่รู้ว่ามีอยู่ในระบบเดิม แต่ยังไม่มี spec ยืนยันชัดเจน
        description:
          type: string
          nullable: true
        supportedModels:
          type: array
          description: >-
            รุ่นอุปกรณ์/โปรโตคอลที่ field นี้ใช้ได้ (Semantic Validation
            v3.11) — Config ที่ deviceModel/protocol ไม่อยู่ในรายการนี้
            จะถูก block ตอน create/update Config
          items:
            $ref: "#/components/schemas/ConfigFieldDefinitionModelSupport"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConfigFieldDefinitionModelSupport:
      type: object
      description: คู่ (deviceModel, protocol) หนึ่งคู่ที่ field definition ใช้ได้
      required: [deviceModel, protocol]
      properties:
        deviceModel:
          type: string
          example: GT06N
        protocol:
          type: string
          example: TCP

    CreateConfigDefinitionInput:
      type: object
      description: Request body สำหรับ createConfigDefinition
      required: [fieldName, dataType, required, supportedModels]
      properties:
        fieldName:
          type: string
          example: APN1
        dataType:
          type: string
          example: string
        allowedValues:
          type: array
          items:
            type: string
        required:
          type: boolean
        unknownSpec:
          type: boolean
          default: false
          description: >-
            field ที่รู้ว่ามีอยู่ในระบบเดิม แต่ยังไม่มี spec ยืนยันชัดเจน
            (รู้แค่ชื่อ + dataType) — ปล่อยว่างได้ default false
        description:
          type: string
        supportedModels:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ConfigFieldDefinitionModelSupport"

    # เพิ่มใหม่: แยกจาก DeviceConfigDraft เพราะ request body ของ createConfig/
    # updateConfig ไม่ควรรับ id/status จาก client (server เป็นคนกำหนดเท่านั้น —
    # DTO ฝั่ง backend ใช้ forbidNonWhitelisted ปฏิเสธ field แปลกปลอมอยู่แล้ว
    # ถ้า client ยิงตาม DeviceConfigDraft เป๊ะๆ พร้อม id/status จะโดน 400)
    ConfigWriteInput:
      type: object
      description: Request body สำหรับ createConfig/updateConfig — ไม่มี id/status (server กำหนดเอง)
      properties:
        deviceModel:
          type: string
        protocol:
          type: string
          example: TCP
        fields:
          type: object
          additionalProperties: true
          description: ค่า field ตาม Config Definition Lookup (เช่น APN1, MTYP, SIM1)

    Task:
      type: object
      description: งานที่มอบหมายให้ทีมช่างหน้างาน (ตรงกับ Prisma model Task)
      required: [id, title, assignedTo, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        assignedTo:
          type: string
          description: user id ของผู้รับผิดชอบงาน
        deviceId:
          type: string
          nullable: true
          description: กล่อง GPS ที่เกี่ยวข้องกับงานนี้ (ถ้ามี)
        configId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Config ที่ Operation ผูกกับงานติดตั้ง/เปลี่ยน config — Mobile อ่านค่านี้
            ส่งเป็น body ของ POST /devices/{deviceId}/apply-config ตอนทำจอ Confirm
            Install · null สำหรับงานประเภทอื่น (เช็คสัญญาณ, เปลี่ยนซิม)
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
        dueDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskCreateRequest:
      type: object
      required: [title, assignedTo]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        assignedTo:
          type: string
        deviceId:
          type: string
        configId:
          type: string
          format: uuid
          description: >-
            ต้องเป็น Config สถานะ approved หรือ synced เท่านั้น — ถ้าระบุ deviceId
            ด้วยและมี Device record จริง deviceModel/protocol ต้องตรงกัน
        dueDate:
          type: string
          format: date-time

    TaskUpdateRequest:
      type: object
      description: ส่งเฉพาะ field ที่ต้องการแก้ (partial update)
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        assignedTo:
          type: string
        deviceId:
          type: string
          nullable: true
        configId:
          type: string
          format: uuid
          nullable: true
          description: >-
            ผูก/เปลี่ยน Config ของงาน (Operation เท่านั้น — ST/OT แก้ได้เฉพาะ status)
            ส่ง null เพื่อล้างค่า · เงื่อนไข Config เหมือน TaskCreateRequest.configId
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
        dueDate:
          type: string
          format: date-time
          nullable: true

    Firmware:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        deviceModelCompatibility:
          type: array
          items:
            type: string
        uploadStatus:
          type: string
          description: สถานะอัปโหลด/จัดเก็บฝั่งเรา (v3.7)
          enum: [pending, stored, failed]
        deviceUpdateStatus:
          type: string
          description: สถานะอัปเดตเวอร์ชันจริงของกล่อง อ้างอิงจาก device-status (v3.7)
          enum: [unknown, up_to_date, pending_update]

    SimulationResult:
      type: object
      properties:
        passed:
          type: boolean
        details:
          type: array
          items:
            type: string

    DeviceConnectionTestResult:
      type: object
      description: ผลทดสอบการเชื่อมต่อของอุปกรณ์ที่ติดตั้งจริง (`testDeviceConnection`)
      required: [passed, signalStrength, details, testedAt]
      properties:
        passed:
          type: boolean
        signalStrength:
          type: integer
          description: ความแรงสัญญาณ (dBm) — mock mode คืนค่าคงที่ให้ Mobile ทำ/ทดสอบ UI ได้
          example: -65
        details:
          type: array
          items:
            type: string
        testedAt:
          type: string
          format: date-time

    ConfigApplyInput:
      type: object
      description: Request body สำหรับ applyConfigToDevice
      required: [configId]
      properties:
        configId:
          type: string
          format: uuid
          description: id ของ Config ที่จะใส่ (ต้องเป็นสถานะ approved หรือ synced)

    ConfigApplyResult:
      type: object
      description: >-
        ผลการใส่ Config ให้อุปกรณ์ (`applyConfigToDevice`) — ไม่มีสถานะอุปกรณ์
        เพราะกล่องรับค่าเมื่อเปิดเครื่องครั้งถัดไปเท่านั้น (ไม่มี ack แบบ synchronous)
      required: [applied, details, appliedAt]
      properties:
        applied:
          type: boolean
          description: "ถ้า false = ค่าใน Config ไม่ผ่านการตรวจเบื้องต้น (ดู details)"
        details:
          type: array
          items:
            type: string
        appliedAt:
          type: string
          format: date-time
          description: เวลาที่ server รับคำสั่ง (ไม่ใช่เวลาที่กล่องรับค่าจริง)

    DeviceStatus:
      type: object
      properties:
        deviceId:
          type: string
        configStatus:
          type: string
        firmwareStatus:
          type: string
        lastCheckInMessage:
          type: string
          example: "จะได้รับการอัปเดตในการเปิดเครื่องครั้งถัดไปของกล่อง"

    Notification:
      type: object
      description: Notification record ของ user (ตรงกับ Prisma model Notification)
      required: [id, userId, type, payload, read, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
