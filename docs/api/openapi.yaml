openapi: 3.0.3
info:
  title: GPS Config & Firmware Center API
  description: >
    โครง API เริ่มต้นสำหรับ Sprint 0 — ยังไม่ครบทุก Endpoint
    เพิ่มเติมทีละ Phase ตามที่ Build จริง (ดู 01_GPS_Build_Reference.md Section 3)
  version: "0.1.0"
servers:
  - url: http://localhost:3001/api/v1
    description: Local dev

# บังคับ Bearer JWT ทุก endpoint โดย default — override เป็น security: [] เฉพาะ endpoint ที่เป็น public
security:
  - bearerAuth: []

tags:
  - name: auth
    description: Login และการยืนยันตัวตน (JWT)
  - name: config
    description: จัดการ Device Config — สร้าง/นำเข้า/ทดสอบ/อนุมัติ
  - name: firmware
    description: อัปโหลดและทดสอบ Firmware ของกล่อง
  - name: device-status
    description: สถานะ Config และ Firmware รายกล่อง
  - name: task
    description: มอบหมาย/ติดตามงานให้ทีมช่างหน้างาน (เชื่อมกับ Mobile app)

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login ด้วย Username/Password
      security: []   # public — ยังไม่มี token ตอนเรียก login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login สำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Username/Password ไม่ถูกต้อง

  /config:
    get:
      tags: [config]
      operationId: listConfigs
      summary: ดึงรายการ Config ทั้งหมด (แบ่งตาม status)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, testing, sw_approved, operation_approved, rejected, synced]
      responses:
        "200":
          description: รายการ Config
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceConfigDraft"
    post:
      tags: [config]
      operationId: createConfig
      summary: สร้าง Config ใหม่ผ่านฟอร์ม (Draft)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceConfigDraft"
      responses:
        "201":
          description: สร้างสำเร็จ

  /config/import:
    post:
      tags: [config]
      operationId: importConfig
      summary: Import Config จากไฟล์ (v3.2 — รองรับ JSON เป็นจุดเริ่มต้น)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                format:
                  type: string
                  enum: [json]
      responses:
        "201":
          description: Import สำเร็จ แปลงเป็น DeviceConfigDraft แล้ว เข้า flow ทดสอบ/อนุมัติเดียวกับฟอร์ม

  /config/{configId}/simulate:
    post:
      tags: [config]
      operationId: simulateConfig
      summary: ทดสอบ Config กับ Device Simulator (ใช้ทั้งฝั่ง Web และ Mobile — v3.5)
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceModel:
                  type: string
      responses:
        "200":
          description: ผลทดสอบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"

  /config/{configId}/approve:
    post:
      tags: [config]
      operationId: approveConfig
      summary: Operation อนุมัติ Config
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: อนุมัติสำเร็จ — เข้า flow config-sync-writer ต่อ

  /config/{configId}/reject:
    post:
      tags: [config]
      operationId: rejectConfig
      summary: Operation ปฏิเสธ Config (สถานะย้อนกลับไป Draft ทั้งหมด)
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ปฏิเสธสำเร็จ

  /tasks:
    get:
      tags: [task]
      operationId: listTasks
      summary: ดึงรายการงานทั้งหมด (กรองด้วย status / assignedTo ได้)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, completed, cancelled]
        - in: query
          name: assignedTo
          description: กรองเฉพาะงานของผู้รับผิดชอบคนใดคนหนึ่ง (user id)
          schema:
            type: string
      responses:
        "200":
          description: รายการงาน
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "400":
          description: ค่า query parameter ไม่ถูกต้อง
    post:
      tags: [task]
      operationId: createTask
      summary: สร้างงานใหม่ (status เริ่มต้นเป็น pending)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: สร้างงานสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: ข้อมูลไม่ถูกต้อง

  /tasks/{taskId}:
    get:
      tags: [task]
      operationId: getTask
      summary: ดึงรายละเอียดงาน 1 รายการ
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: รายละเอียดงาน
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: ไม่พบงานนี้
    patch:
      tags: [task]
      operationId: updateTask
      summary: แก้ไขงาน (เช่น เปลี่ยน status, ผู้รับผิดชอบ, กำหนดส่ง)
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdateRequest"
      responses:
        "200":
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: ข้อมูลไม่ถูกต้อง
        "404":
          description: ไม่พบงานนี้

  /firmware:
    get:
      tags: [firmware]
      operationId: listFirmware
      summary: รายการ Firmware ที่อัปโหลดเข้าระบบ
      responses:
        "200":
          description: รายการ Firmware
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Firmware"
    post:
      tags: [firmware]
      operationId: uploadFirmware
      summary: อัปโหลด Firmware เข้าระบบเราโดยตรง (v3.7 — ทางเดียว ไม่มีช่องทางดึงจากระบบเดิมแล้ว)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                deviceModel:
                  type: string
      responses:
        "201":
          description: อัปโหลดสำเร็จ — แสดง upload_status บนหน้าเว็บ

  /firmware/{firmwareId}/simulate:
    post:
      tags: [firmware]
      operationId: simulateFirmware
      summary: ทดสอบ Firmware กับ Device Simulator (ใช้ทั้งฝั่ง Web และ Mobile — v3.5)
      parameters:
        - in: path
          name: firmwareId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceModel:
                  type: string
      responses:
        "200":
          description: ผลทดสอบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"

  /devices/{deviceId}/status:
    get:
      tags: [device-status]
      operationId: getDeviceStatus
      summary: >
        ดูสถานะกล่อง (Config + Firmware) — ครอบคลุมทั้งสถานะ Config
        และสถานะอัปเดตเวอร์ชัน Firmware ของตัวกล่อง (v3.7)
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: สถานะล่าสุด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        role:
          type: string
          enum: [SW, Operation, ST, OT, Auditor, Admin, FieldTechnician]

    DeviceConfigDraft:
      type: object
      description: โครงสร้างกลางที่ทั้งฟอร์มและ Import JSON แปลงเข้ามาเป็นแบบเดียวกัน
      properties:
        id:
          type: string
        deviceModel:
          type: string
        protocol:
          type: string
          example: TCP
        status:
          type: string
          enum: [draft, testing, sw_approved, operation_approved, rejected, synced]
        fields:
          type: object
          additionalProperties: true
          description: ค่า field ตาม Config Definition Lookup (เช่น APN1, MTYP, SIM1)

    Task:
      type: object
      description: งานที่มอบหมายให้ทีมช่างหน้างาน (ตรงกับ Prisma model Task)
      required: [id, title, assignedTo, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        assignedTo:
          type: string
          description: user id ของผู้รับผิดชอบงาน
        deviceId:
          type: string
          nullable: true
          description: กล่อง GPS ที่เกี่ยวข้องกับงานนี้ (ถ้ามี)
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
        dueDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskCreateRequest:
      type: object
      required: [title, assignedTo]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        assignedTo:
          type: string
        deviceId:
          type: string
        dueDate:
          type: string
          format: date-time

    TaskUpdateRequest:
      type: object
      description: ส่งเฉพาะ field ที่ต้องการแก้ (partial update)
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        assignedTo:
          type: string
        deviceId:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
        dueDate:
          type: string
          format: date-time
          nullable: true

    Firmware:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        deviceModelCompatibility:
          type: array
          items:
            type: string
        uploadStatus:
          type: string
          description: สถานะอัปโหลด/จัดเก็บฝั่งเรา (v3.7)
          enum: [pending, stored, failed]
        deviceUpdateStatus:
          type: string
          description: สถานะอัปเดตเวอร์ชันจริงของกล่อง อ้างอิงจาก device-status (v3.7)
          enum: [unknown, up_to_date, pending_update]

    SimulationResult:
      type: object
      properties:
        passed:
          type: boolean
        details:
          type: array
          items:
            type: string

    DeviceStatus:
      type: object
      properties:
        deviceId:
          type: string
        configStatus:
          type: string
        firmwareStatus:
          type: string
        lastCheckInMessage:
          type: string
          example: "จะได้รับการอัปเดตในการเปิดเครื่องครั้งถัดไปของกล่อง"
